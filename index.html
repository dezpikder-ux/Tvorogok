<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ТВОРОЖОК</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none;
      -webkit-tap-highlight-color:transparent;
      font-family:'Fredoka','Trebuchet MS',sans-serif; }
  html, body { width:100%; height:100%; overflow:hidden; }
  body { background:#ffd6e0; transition:background 0.4s; }
  body.dark { background:#151520; }
  #cv { display:block; width:100%; height:100%; touch-action:none; }
  .hud { position:absolute; top:0; left:0; right:0; padding:18px 20px;
    display:flex; justify-content:space-between; align-items:flex-start;
    pointer-events:none; z-index:5; }
  .hud .score { font-family:'Archivo Black', sans-serif; font-size:42px;
    font-weight:900; color:#ffffff;
    text-shadow: 0 0 10px #ffffff, 0 0 25px #ffffff, 0 0 45px #ff6b9d, 0 0 70px #ff6b9d, 4px 4px 0 rgba(120,60,100,0.35);
    line-height:1; }
  .hud .back { pointer-events:auto; padding:10px 18px; font-size:15px;
    font-family:inherit; border:3px solid #ffffff; border-radius:16px;
    background:linear-gradient(135deg, #c4a8ff, #8c5cff); color:#ffffff;
    font-weight:700; box-shadow: 0 5px 0 rgba(90,40,150,0.45), 0 0 18px rgba(255,255,255,0.4);
    cursor:pointer; transition:0.08s; text-transform: uppercase;
    letter-spacing:1px; text-shadow: 0 0 8px rgba(255,255,255,0.9); }
  .hud .back:active { transform:translateY(3px); box-shadow:0 2px 0 rgba(90,40,150,0.45); }
  .menu { position:absolute; inset:0; z-index:10; display:flex; flex-direction:column;
    justify-content:center; align-items:center; gap:14px; pointer-events:none;
    overflow-y:auto; padding: 20px; }
  .menu > * { pointer-events: auto; }
  .menu h1 { font-family:'Archivo Black', sans-serif; font-size:50px; font-weight:900;
    color:#ffffff; margin-bottom:8px; letter-spacing:5px;
    text-shadow: 0 0 6px #ffffff, 0 0 14px #ffffff, 0 0 28px #ffd0e8,
      0 0 48px #ff6b9d, 0 0 80px #ff6b9d, 5px 5px 0 #ff8ec4, 8px 8px 0 rgba(200,60,120,0.35); }
  .menu .btn { width:230px; padding:14px; font-size:18px; font-family:inherit;
    font-weight:700; letter-spacing:3px; text-transform:uppercase;
    border:4px solid #ffffff; border-radius:22px; color:#ffffff; cursor:pointer;
    transition:0.08s;
    text-shadow: 0 0 6px #ffffff, 0 0 14px rgba(255,255,255,0.8), 2px 2px 0 rgba(0,0,0,0.15); }
  .menu .btn.tap { background:linear-gradient(135deg, #ff9ec4, #ff5c9a);
    box-shadow: 0 7px 0 rgba(200,60,120,0.45), inset 0 3px 0 rgba(255,255,255,0.4), 0 0 25px rgba(255,140,200,0.5); }
  .menu .btn.jump { background:linear-gradient(135deg, #c4a8ff, #8c5cff);
    box-shadow: 0 7px 0 rgba(90,40,150,0.45), inset 0 3px 0 rgba(255,255,255,0.4), 0 0 25px rgba(160,120,255,0.5); }
  .menu .btn.slap { background:linear-gradient(135deg, #ff8a8a, #d92a2a);
    box-shadow: 0 7px 0 rgba(140,20,20,0.45), inset 0 3px 0 rgba(255,255,255,0.4), 0 0 25px rgba(255,100,100,0.5); }
  .menu .btn.shop { background:linear-gradient(135deg, #ffd97a, #ffb030);
    box-shadow: 0 7px 0 rgba(180,110,20,0.45), inset 0 3px 0 rgba(255,255,255,0.4), 0 0 25px rgba(255,200,80,0.5); }
  .menu .btn.save { background:linear-gradient(135deg, #a8ffd0, #4cd890);
    box-shadow: 0 7px 0 rgba(30,140,90,0.45), inset 0 3px 0 rgba(255,255,255,0.4), 0 0 25px rgba(100,240,160,0.5); }
  .menu .btn.ach { background:linear-gradient(135deg, #ffd0e8, #c86ad8);
    box-shadow: 0 7px 0 rgba(140,40,150,0.45), inset 0 3px 0 rgba(255,255,255,0.4), 0 0 25px rgba(200,100,220,0.5); }
  .menu .btn:active { transform:translateY(4px); box-shadow: 0 4px 0 rgba(200,60,120,0.45); }
  .menu-top { position:absolute; top:20px; right:20px; display:flex; gap:8px; z-index: 12; }
  .icon-btn { width:44px; height:44px; border-radius:50%; border:3px solid #ffffff;
    background:rgba(255,255,255,0.25); color:#ffffff; font-size:20px;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    box-shadow: 0 4px 0 rgba(90,40,150,0.4); backdrop-filter: blur(4px);
    transition: 0.1s; }
  .icon-btn:active { transform:translateY(3px); box-shadow: 0 1px 0 rgba(90,40,150,0.4); }
  .coin-badge { position:absolute; top:22px; left:22px; display:flex; align-items:center;
    gap:8px; padding:8px 16px; background:#ffffff; border:3px solid #ffffff;
    border-radius:24px; box-shadow: 0 4px 0 rgba(180,110,20,0.35), 0 0 18px rgba(255,200,80,0.5);
    font-weight:700; font-size:18px; color:#b87020; letter-spacing:1px; z-index: 11; }
  .coin-icon { width:22px; height:22px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #ffe98a, #ffb030 70%);
    box-shadow: inset 0 -2px 0 rgba(150,80,0,0.4), 0 0 8px rgba(255,200,80,0.8); position:relative; }
  .coin-icon::after { content: ''; position:absolute; inset: 6px 7px; border-radius:50%;
    background: radial-gradient(circle, #ffb030, transparent); }
  .overlay { position:absolute; inset:0; z-index:8; display:flex; flex-direction:column;
    justify-content:center; align-items:center; gap:14px;
    background: rgba(255,214,224,0.94); padding: 30px; transition:background 0.4s; }
  body.dark .overlay { background: rgba(20,20,35,0.94); }
  .overlay h2 { font-family:'Archivo Black', sans-serif; font-size:42px; font-weight:900;
    color:#ffffff;
    text-shadow: 0 0 6px #ffffff, 0 0 16px #ffffff, 0 0 32px #ffd0e8, 0 0 55px #ff6b9d, 4px 4px 0 #ff8ec4;
    letter-spacing:3px; text-align:center; }
  .overlay .score-line { font-size: 24px; font-weight:700; color:#ffffff;
    text-shadow: 0 0 10px #ffffff, 0 0 22px rgba(255,140,200,0.9); letter-spacing:2px; text-align:center; }
  .overlay .coins-earned { font-size: 22px; font-weight:700; color:#ffffff;
    text-shadow: 0 0 10px #ffffff, 0 0 22px #ffd97a; padding: 8px 22px; border-radius: 20px;
    background: rgba(255,180,50,0.45); border: 3px solid #ffffff; letter-spacing:2px;
    margin-top: 6px; box-shadow: 0 0 25px rgba(255,200,80,0.6); }
  .overlay .btn { padding:14px 34px; font-size:18px; font-family:inherit; font-weight:700;
    letter-spacing:3px; text-transform:uppercase; border:4px solid #ffffff; border-radius:22px;
    background:linear-gradient(135deg, #ff9ec4, #ff5c9a); color:#ffffff; cursor:pointer;
    box-shadow: 0 7px 0 rgba(200,60,120,0.45), inset 0 3px 0 rgba(255,255,255,0.4), 0 0 25px rgba(255,140,200,0.6);
    text-shadow: 0 0 8px #ffffff, 2px 2px 0 rgba(0,0,0,0.15); }
  .overlay .btn:active { transform:translateY(4px); box-shadow: 0 3px 0 rgba(200,60,120,0.45); }
  .modal-bg { position:absolute; inset:0; z-index:20; display:flex;
    align-items:center; justify-content:center; background: rgba(120, 60, 100, 0.55);
    padding: 20px; backdrop-filter: blur(3px); }
  body.dark .modal-bg { background: rgba(0,0,0,0.7); }
  .modal-window { background: linear-gradient(180deg, #ffd6e0 0%, #ffe5cc 55%, #d8d0f0 100%);
    border-radius: 28px; padding: 18px; width: 100%; max-width: 360px; max-height: 82vh;
    display: flex; flex-direction: column;
    box-shadow: 0 20px 60px rgba(120, 60, 100, 0.5), 0 0 0 4px #ffffff, 0 0 40px rgba(255,180,220,0.6);
    border: 3px solid rgba(255,255,255,0.6); position: relative; }
  body.dark .modal-window { background: linear-gradient(180deg, #2a2a3a 0%, #1a1a28 100%); }
  .modal-header { display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 12px; gap: 8px; }
  .modal-header .back-icon { width:40px; height:40px; border-radius:50%;
    border:3px solid #ffffff; background:linear-gradient(135deg, #c4a8ff, #8c5cff);
    color:#ffffff; font-size:18px; font-weight:700;
    box-shadow: 0 4px 0 rgba(90,40,150,0.45), 0 0 15px rgba(160,120,255,0.6);
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    padding-bottom: 3px; flex-shrink: 0; }
  .modal-header .back-icon:active { transform:translateY(3px); box-shadow: 0 1px 0 rgba(90,40,150,0.45); }
  .modal-header h2 { font-family:'Archivo Black', sans-serif; font-size:22px; font-weight:900;
    color:#ffffff;
    text-shadow: 0 0 8px #ffffff, 0 0 18px #ffffff, 0 0 32px #ffd0e8, 0 0 50px #ff6b9d, 3px 3px 0 #ff8ec4;
    letter-spacing:3px; flex: 1; text-align: center; }
  .char-tabs { display:flex; gap: 10px; margin-bottom: 12px; }
  .char-tab { flex:1; padding: 12px 8px; border-radius: 16px;
    font-family: inherit; font-weight: 700; font-size: 14px;
    letter-spacing: 2px; text-transform: uppercase; cursor: pointer;
    border: 3px solid #ffffff; transition: 0.15s;
    background: rgba(255,255,255,0.5); color: #7a4a8a;
    text-shadow: 0 0 6px rgba(255,255,255,0.5); }
  .char-tab.sonya.active {
    background: linear-gradient(135deg, #ff9ec4, #ff5c9a);
    color: #ffffff;
    box-shadow: 0 4px 0 rgba(200,60,120,0.5), 0 0 20px rgba(255,140,200,0.7);
    text-shadow: 0 0 8px #ffffff; }
  .char-tab.veronika.active {
    background: linear-gradient(135deg, #a8a8c8, #4a4a6a);
    color: #ffffff;
    box-shadow: 0 4px 0 rgba(40,40,80,0.5), 0 0 20px rgba(120,120,180,0.7);
    text-shadow: 0 0 8px #ffffff; }
  .char-tab:active { transform: translateY(2px); }
  .shop-items { flex:1; overflow-y:auto; display:grid; grid-template-columns: 1fr 1fr;
    gap: 8px; padding: 4px; -webkit-overflow-scrolling: touch; }
  .shop-items::-webkit-scrollbar { width: 0; }
  .shop-item { background: #fff; border-radius: 16px; padding: 8px; text-align: center;
    box-shadow: 0 4px 0 rgba(200,60,120,0.3), 0 0 18px rgba(255,180,220,0.4);
    display: flex; flex-direction: column; gap: 5px; border: 3px solid #ffffff; }
  body.dark .shop-item { background: #2a2a3a; }
  .shop-item.equipped { box-shadow: 0 4px 0 rgba(200,60,120,0.3), 0 0 0 3px #ffb030, 0 0 25px rgba(255,180,50,0.7); }
  .shop-item-preview { height: 55px; border-radius: 12px; display: flex;
    align-items: center; justify-content: center;
    background: linear-gradient(180deg, #fff5fa, #ffe8f2); overflow: hidden; position: relative; }
  body.dark .shop-item-preview { background: linear-gradient(180deg, #3a3a4a, #2a2a38); }
  .shop-item-name { font-size: 10px; font-weight: 700; color: #5a2a4a;
    text-transform: uppercase; letter-spacing: 0.3px; min-height: 26px;
    display: flex; align-items: center; justify-content: center; line-height: 1.15; }
  body.dark .shop-item-name { color: #d0b0e0; }
  .shop-item-desc { font-size: 8px; font-weight: 500; color: #9a6a8a;
    font-style: italic; letter-spacing: 0.2px; line-height: 1.15; min-height: 20px;
    display: flex; align-items: center; justify-content: center; text-align: center; }
  .shop-item-btn { padding: 7px; border-radius: 10px; border: none; font-family: inherit;
    font-weight: 700; font-size: 11px; cursor: pointer; text-transform: uppercase;
    letter-spacing: 0.8px; background: linear-gradient(135deg, #ff9ec4, #ff5c9a);
    color: #fff; box-shadow: 0 3px 0 rgba(200,60,120,0.4), 0 0 12px rgba(255,140,200,0.5);
    text-shadow: 0 0 6px rgba(255,255,255,0.7); }
  .shop-item-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(200,60,120,0.4); }
  .shop-item-btn.buy { background: linear-gradient(135deg, #ffd97a, #ffb030);
    color: #ffffff; box-shadow: 0 3px 0 rgba(180,110,20,0.45), 0 0 12px rgba(255,200,80,0.6); }
  .shop-item-btn.equip { background: linear-gradient(135deg, #a8ffd0, #4cd890);
    box-shadow: 0 3px 0 rgba(30,140,90,0.45), 0 0 12px rgba(100,240,160,0.6); }
  .shop-item-btn:disabled { background: #d8d8e0; color: #9a9aa8;
    box-shadow: 0 3px 0 rgba(0,0,0,0.08); cursor: default; text-shadow: none; }
  .ach-item { background: #fff; border-radius: 16px; padding: 10px 12px;
    display: flex; align-items: center; gap: 12px; margin-bottom: 8px;
    box-shadow: 0 3px 0 rgba(200,60,120,0.25); border: 3px solid #ffffff;
    opacity: 0.45; transition: 0.2s; }
  body.dark .ach-item { background: #2a2a3a; }
  .ach-item.done { opacity: 1; box-shadow: 0 3px 0 rgba(255,180,50,0.5), 0 0 18px rgba(255,200,80,0.4); }
  .ach-item .icon { font-size: 30px; flex-shrink: 0; }
  .ach-item .text { flex: 1; }
  .ach-item .text .name { font-weight: 700; font-size: 14px; color: #5a2a4a;
    text-transform: uppercase; letter-spacing: 1px; }
  body.dark .ach-item .text .name { color: #e0c8f0; }
  .ach-item .text .desc { font-size: 11px; color: #9a6a8a; margin-top: 2px; }
  .ach-list { flex:1; overflow-y:auto; padding: 4px; }
  .ach-list::-webkit-scrollbar { width: 0; }
  .hidden { display:none !important; }
  .toast-ach { position:fixed; top: 90px; left: 50%; transform:translateX(-50%);
    background: linear-gradient(135deg, #ffd97a, #ffb030);
    color: #fff; padding: 12px 24px; border-radius: 20px;
    font-weight: 700; font-size: 14px; letter-spacing: 1px;
    box-shadow: 0 8px 25px rgba(200,120,20,0.5), 0 0 0 3px #ffffff;
    z-index: 200; pointer-events: none; text-transform: uppercase;
    text-shadow: 0 0 8px rgba(255,255,255,0.8);
    display: flex; align-items: center; gap: 8px; }
  @keyframes toastAch {
    0% { opacity:0; transform: translate(-50%, -30px) scale(0.9); }
    15% { opacity:1; transform: translate(-50%, 0) scale(1); }
    80% { opacity:1; transform: translate(-50%, 0) scale(1); }
    100% { opacity:0; transform: translate(-50%, -30px) scale(0.9); }
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div class="hud hidden" id="hud">
  <div class="score" id="score">0</div>
  <button class="back" id="backBtn">← НАЗАД</button>
</div>

<div class="menu" id="menu">
  <div class="menu-top">
    <button class="icon-btn" id="themeBtn" title="Тема">🌙</button>
    <button class="icon-btn" id="soundBtn" title="Звук">🔊</button>
  </div>
  <div class="coin-badge">
    <div class="coin-icon"></div>
    <span id="menuCoins">0</span>
  </div>
  <h1>ТВОРОЖОК</h1>
  <button class="btn tap" id="mode1">ТАПАТЬ</button>
  <button class="btn jump" id="mode2">ПРЫГАТЬ</button>
  <button class="btn slap" id="mode3">ШЛЁПАТЬ</button>
  <button class="btn shop" id="shopBtn">МАГАЗИН</button>
  <button class="btn ach" id="achBtn">ДОСТИЖЕНИЯ</button>
  <button class="btn save" id="saveBtn">СОХРАНИТЬ</button>
</div>

<div class="modal-bg hidden" id="shop">
  <div class="modal-window">
    <div class="modal-header">
      <button class="back-icon" id="shopBack">←</button>
      <h2>МАГАЗИН</h2>
      <div class="coin-badge" style="position:static; flex-shrink:0;">
        <div class="coin-icon"></div>
        <span id="shopCoins">0</span>
      </div>
    </div>
    <div class="char-tabs">
      <button class="char-tab sonya active" data-char="sonya">СОНЯ</button>
      <button class="char-tab veronika" data-char="veronika">ВЕРОНИКА</button>
    </div>
    <div class="shop-items" id="shopItems"></div>
  </div>
</div>

<div class="modal-bg hidden" id="ach">
  <div class="modal-window">
    <div class="modal-header">
      <button class="back-icon" id="achBack">←</button>
      <h2>ДОСТИЖЕНИЯ</h2>
      <div style="width:40px;"></div>
    </div>
    <div class="ach-list" id="achList"></div>
  </div>
</div>

<div class="overlay hidden" id="overlay">
  <h2 id="overlayTitle"></h2>
  <div class="score-line" id="overlayScore"></div>
  <div class="coins-earned" id="overlayCoins"></div>
  <button class="btn" id="overlayBtn">ЕЩЁ РАЗ</button>
</div>

<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const hud = document.getElementById('hud');
const menu = document.getElementById('menu');
const shop = document.getElementById('shop');
const ach = document.getElementById('ach');
const shopItems = document.getElementById('shopItems');
const achList = document.getElementById('achList');
const scoreEl = document.getElementById('score');
const backBtn = document.getElementById('backBtn');
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlayTitle');
const overlayScore = document.getElementById('overlayScore');
const overlayCoins = document.getElementById('overlayCoins');
const overlayBtn = document.getElementById('overlayBtn');
const menuCoins = document.getElementById('menuCoins');
const shopCoins = document.getElementById('shopCoins');

// ============ АУДИО ============
let audioCtx = null;
let musicStarted = false;
let currentChord = 0;
let melodyStep = 0;
let soundEnabled = true;

function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
}

const CHORDS = [
  [261.63, 329.63, 392.00],
  [220.00, 261.63, 329.63],
  [174.61, 220.00, 261.63],
  [196.00, 246.94, 293.66],
];
const MELODY_NOTES = [
  523.25, 587.33, 659.25, 587.33, 523.25, 493.88, 440.00, 493.88,
  523.25, 587.33, 659.25, 783.99, 659.25, 587.33, 523.25, 440.00
];

function playNote(freq, dur, vol, type) {
  if (!soundEnabled) return;
  if (!audioCtx) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, audioCtx.currentTime);
  g.gain.setValueAtTime(0, audioCtx.currentTime);
  g.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + 0.05);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + dur);
}

function playChord() {
  if (!audioCtx || !soundEnabled) return;
  const chord = CHORDS[currentChord];
  chord.forEach((freq, i) => {
    setTimeout(() => playNote(freq, 2.5, 0.035, 'sine'), i * 30);
    setTimeout(() => playNote(freq * 2, 2.0, 0.012, 'triangle'), i * 30);
  });
  for (let i = 0; i < 4; i++) {
    const noteIdx = (melodyStep * 4 + i) % MELODY_NOTES.length;
    setTimeout(() => playNote(MELODY_NOTES[noteIdx], 0.9, 0.025, 'sine'), i * 500);
  }
  melodyStep++;
  currentChord = (currentChord + 1) % CHORDS.length;
}

function startBgMusic() {
  if (musicStarted) return;
  initAudio();
  if (!audioCtx) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  musicStarted = true;
  playChord();
  setInterval(playChord, 2000);
}

function playTone(freq, dur, type, vol, slide) {
  if (!soundEnabled) return;
  initAudio();
  if (!audioCtx) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, audioCtx.currentTime);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, audioCtx.currentTime + dur);
  g.gain.setValueAtTime(vol || 0.15, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + dur);
}

function sfxEat() { playTone(500, 0.12, 'sine', 0.15, 900); setTimeout(() => playTone(700, 0.1, 'sine', 0.12, 1000), 60); }
function sfxJump() { playTone(400, 0.15, 'triangle', 0.13, 750); }
function sfxCoin() { playTone(880, 0.08, 'sine', 0.12); setTimeout(() => playTone(1320, 0.12, 'sine', 0.12), 70); }
function sfxClick() { playTone(600, 0.06, 'square', 0.08); }
function sfxBuy() { playTone(600, 0.08, 'sine', 0.13); setTimeout(() => playTone(800, 0.08, 'sine', 0.13), 70); setTimeout(() => playTone(1000, 0.15, 'sine', 0.13), 140); }
function sfxGameOver() { playTone(500, 0.15, 'sawtooth', 0.1); setTimeout(() => playTone(400, 0.15, 'sawtooth', 0.1), 100); setTimeout(() => playTone(300, 0.3, 'sawtooth', 0.1), 200); }
function sfxSlap() {
  if (!audioCtx || !soundEnabled) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const bufferSize = audioCtx.sampleRate * 0.1;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 3);
  }
  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'bandpass';

  noise.connect(filter); filter.connect(g); g.connect(audioCtx.destination);
  noise.start();
  playTone(180, 0.12, 'sawtooth', 0.1, 90);
}

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

let skyTime = 0;
const DAY_CYCLE = 45000;
function getSkyPhase() { return (skyTime % DAY_CYCLE) / DAY_CYCLE; }
function lerp(a, b, t) { return a + (b - a) * t; }
function lerpColor(c1, c2, t) {
  return [Math.round(lerp(c1[0], c2[0], t)), Math.round(lerp(c1[1], c2[1], t)), Math.round(lerp(c1[2], c2[2], t))];
}
function rgb(c) { return `rgb(${c[0]},${c[1]},${c[2]})`; }

const SKY_PALETTES = {
  day:   { top:[135,206,250], mid:[255,229,204], bot:[216,208,240], isNight:false },
  sunset:{ top:[255,150,150], mid:[255,180,140], bot:[200,140,200], isNight:false },
  night: { top:[20,30,70],    mid:[40,50,100],  bot:[70,60,120],  isNight:true  },
  dawn:  { top:[200,160,220], mid:[255,200,180], bot:[255,180,200], isNight:false }
};

function getSkyPalette() {
  const p = getSkyPhase();
  let from, to, t;
  if (p < 0.35) { from = SKY_PALETTES.day; to = SKY_PALETTES.day; t = 0; }
  else if (p < 0.5) { from = SKY_PALETTES.day; to = SKY_PALETTES.sunset; t = (p - 0.35) / 0.15; }
  else if (p < 0.6) { from = SKY_PALETTES.sunset; to = SKY_PALETTES.night; t = (p - 0.5) / 0.1; }
  else if (p < 0.65) { from = SKY_PALETTES.night; to = SKY_PALETTES.night; t = 0; }
  else if (p < 0.8) { from = SKY_PALETTES.night; to = SKY_PALETTES.dawn; t = (p - 0.65) / 0.15; }
  else { from = SKY_PALETTES.dawn; to = SKY_PALETTES.day; t = (p - 0.8) / 0.2; }
  return {
    top: rgb(lerpColor(from.top, to.top, t)),
    mid: rgb(lerpColor(from.mid, to.mid, t)),
    bot: rgb(lerpColor(from.bot, to.bot, t)),
    darkness: lerp(from.isNight ? 1 : 0, to.isNight ? 1 : 0, t)
  };
}

function updateClouds(dt) {

      c.y = 60 + Math.random() * (H * 0.7);

}

function drawCloudShape(x, y, s, color) {
  ctx.save();
  ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(0, 0, 22, 0, Math.PI * 2);
  ctx.arc(22, 6, 16, 0, Math.PI * 2);
  ctx.arc(-22, 6, 16, 0, Math.PI * 2);
  ctx.arc(0, 10, 18, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawMovingClouds(pal, camY) {
  if (playerData.background !== 'bg_default') return;
  camY = camY || 0;
  const isNight = pal.darkness > 0.5;
  for (const c of clouds) {
    let y = c.y - camY * (0.15 + c.layer * 0.1);
    if (y < -100) y += H + 300;
    if (y > H + 100) y -= H + 300;
    let color;
    if (isNight) color = `rgba(180,190,220,${c.alpha * 0.5})`;
    else color = `rgba(255,255,255,${c.alpha * (1 - pal.darkness * 0.7)})`;
    drawCloudShape(c.x, y, c.s, color);
  }
}

function drawSunMoon(pal) {
  if (playerData.background !== 'bg_default') return;

    const sp = p / 0.5;
    const x = W * sp;
    const y = H * 0.35 - Math.sin(sp * Math.PI) * H * 0.28;
    const alpha = Math.max(0, 1 - Math.abs(p - 0.25) / 0.25);
    ctx.save();
    ctx.shadowColor = 'rgba(255,220,100,0.9)';
    ctx.shadowBlur = 40;
    ctx.fillStyle = `rgba(255,240,150,${alpha})`;
    ctx.beginPath(); ctx.arc(x, y, 40, 0, Math.PI * 2); ctx.fill();

  } else {
    const sp = (p - 0.5) / 0.5;
    const x = W * (1 - sp);
    const y = H * 0.35 - Math.sin(sp * Math.PI) * H * 0.28;
    const alpha = Math.max(0, 1 - Math.abs(p - 0.75) / 0.25);
    ctx.save();
    ctx.shadowColor = 'rgba(200,210,255,0.9)';

    ctx.fillStyle = `rgba(240,240,255,${alpha})`;
    ctx.beginPath(); ctx.arc(x, y, 32, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;

    ctx.beginPath(); ctx.arc(x - 8, y - 5, 5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 6, y + 6, 3.5, 0, Math.PI * 2); ctx.fill();

function drawFluffyPlatform(x, y, w, h, darkness) {
  ctx.save();
  ctx.shadowColor = darkness > 0.5 ? 'rgba(120,100,180,0.5)' : 'rgba(255,140,180,0.35)';
  ctx.shadowBlur = 10; ctx.shadowOffsetY = 3;
  const grad = ctx.createLinearGradient(x, y, x, y + h);
  if (darkness > 0.5) {
    grad.addColorStop(0, '#a0a0c0'); grad.addColorStop(0.5, '#8888b0'); grad.addColorStop(1, '#6868a0');
  } else {
    grad.addColorStop(0, '#ffffff'); grad.addColorStop(0.5, '#ffe4f0'); grad.addColorStop(1, '#ffb8d9');
  }
  ctx.fillStyle = grad;
  const r = h / 2;
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y);
  ctx.arc(x + w - r, y + r, r, -Math.PI/2, Math.PI/2);
  ctx.lineTo(x + r, y + h);
  ctx.arc(x + r, y + r, r, Math.PI/2, -Math.PI/2);
  ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  ctx.fillStyle = darkness > 0.5 ? '#b0b0d0' : '#ffffff';
  const bc = Math.floor(w / 12);
  for (let i = 0; i < bc; i++) {
    ctx.beginPath();
    ctx.arc(x + 8 + i * 12, y + 1, 4 + (i % 2) * 1.5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.fillStyle = darkness > 0.5 ? 'rgba(200,200,255,0.8)' : 'rgba(255,220,120,0.9)';
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.arc(x + 15 + (i * (w - 30) / 2), y - 3, 1.5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

  const w = who || 'sonya';
  const eq = playerData[w].equipped;
  return SHOP_ITEMS.find(i => i.id === eq.skirt) || SHOP_ITEMS[0];
}
function getAccessoryItem(who) {
  const w = who || 'sonya';
  const eq = playerData[w].equipped;
  return SHOP_ITEMS.find(i => i.id === eq.accessory) || SHOP_ITEMS[0];
}
function getHairItem(who) {
  const w = who || 'sonya';
  const eq = playerData[w].equipped;
  return SHOP_ITEMS.find(i => i.id === eq.hair) || SHOP_ITEMS.find(i => i.id === 'default_hair');
}

function drawHairExtra(hairId, cfg) {
  const HD = cfg.hairDark, HM = cfg.hairMid, HL = cfg.hairLight;
  if (hairId === 'hair_pony') {
    ctx.fillStyle = HM;
    ctx.beginPath();
    ctx.moveTo(14, -60);
    ctx.quadraticCurveTo(26, -58, 28, -40);
    ctx.quadraticCurveTo(30, -22, 24, -12);
    ctx.quadraticCurveTo(20, -20, 22, -40);
    ctx.quadraticCurveTo(20, -55, 14, -58);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = HD; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = '#ff5c9a';
    ctx.beginPath(); ctx.arc(15, -59, 3, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#8a1040'; ctx.stroke();
  } else if (hairId === 'hair_twin') {
    ctx.fillStyle = HM;
    ctx.beginPath();
    ctx.moveTo(-14, -62);
    ctx.quadraticCurveTo(-28, -58, -30, -42);
    ctx.quadraticCurveTo(-32, -28, -26, -20);
    ctx.quadraticCurveTo(-22, -28, -24, -44);
    ctx.quadraticCurveTo(-22, -56, -14, -60);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = HD; ctx.lineWidth = 1; ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(14, -62);
    ctx.quadraticCurveTo(28, -58, 30, -42);
    ctx.quadraticCurveTo(32, -28, 26, -20);
    ctx.quadraticCurveTo(22, -28, 24, -44);
    ctx.quadraticCurveTo(22, -56, 14, -60);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ff5c9a';
    ctx.beginPath(); ctx.arc(-15, -61, 3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(15, -61, 3, 0, Math.PI * 2); ctx.fill();
  } else if (hairId === 'hair_bob') {
    ctx.fillStyle = HM;
    ctx.beginPath();
    ctx.moveTo(-18, -50);
    ctx.quadraticCurveTo(-22, -40, -18, -30);
    ctx.lineTo(18, -30);
    ctx.quadraticCurveTo(22, -40, 18, -50);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = HD; ctx.lineWidth = 1; ctx.stroke();
  } else if (hairId === 'hair_bun') {
    ctx.fillStyle = HM;
    ctx.beginPath();
    ctx.arc(0, -78, 12, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = HD; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = HL;
    ctx.beginPath();
    ctx.arc(-4, -80, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ff5c9a';
    ctx.beginPath(); ctx.arc(0, -68, 3, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#8a1040'; ctx.stroke();
  }
}

function drawSonya(x, y, scale, pose, flip, eatPhase, cfg, slapped, opts) {
  if (!cfg) cfg = SONYA_CFG;
  opts = opts || {};
  const charKey = opts.charKey || 'sonya';
  const skirtItem = opts.skirt || getSkirtItem(charKey);
  const accItem = ('acc' in opts) ? opts.acc : getAccessoryItem(charKey);
  const hairItem = opts.hair || getHairItem(charKey);
  const hairId = hairItem ? hairItem.id : 'default_hair';

  const HD = cfg.hairDark, HM = cfg.hairMid, HL = cfg.hairLight;
  const SKIN = '#ffe4d0';
  const BLOUSE = '#ffffff';
  const BLOUSE_SHADE = '#e0e0e0';
  const PANTS = '#151515';
  const SHOE = '#0a0a0a';
  const EYE_IRIS = cfg.eyeIris, EYE_IRIS_DARK = cfg.eyeIrisDark;
  const EYE_PUPIL = '#0d1a0f';

  ctx.save();
  ctx.translate(x, y);
  if (flip) ctx.scale(-scale, scale);
  else ctx.scale(scale, scale);
  if (slapped) ctx.rotate(slapped * 0.15);

  const armPose = (pose === 'eat' && eatPhase > 0.3) ? 'eat' : (pose === 'jump' ? 'jump' : 'idle');
  const armsMap = {
    idle: { left: { sx: -10, sy: -38, ex: -14, ey: -16 }, right: { sx:  10, sy: -38, ex:  14, ey: -16 } },
    jump: { left: { sx: -10, sy: -38, ex: -19, ey: -56 }, right: { sx:  10, sy: -38, ex:  19, ey: -56 } },
    eat:  { left: { sx: -10, sy: -38, ex: -13, ey: -24 }, right: { sx:  10, sy: -38, ex:  13, ey: -24 } }
  };
  const arms = armsMap[armPose];

  if (hairId === 'default_hair' || hairId === 'hair_bob') {
    ctx.fillStyle = HD;
    ctx.beginPath();
    ctx.moveTo(-15, -68);
    ctx.quadraticCurveTo(-19, -55, -18, hairId === 'hair_bob' ? -30 : -42);
    ctx.quadraticCurveTo(-17, hairId === 'hair_bob' ? -28 : -34, -15, -30);
    ctx.lineTo(-9, -30);
    ctx.quadraticCurveTo(-11, -40, -11, -50);
    ctx.quadraticCurveTo(-12, -58, -11, -66);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(15, -68);
    ctx.quadraticCurveTo(19, -55, 18, hairId === 'hair_bob' ? -30 : -42);
    ctx.quadraticCurveTo(17, hairId === 'hair_bob' ? -28 : -34, 15, -30);
    ctx.lineTo(9, -30);
    ctx.quadraticCurveTo(11, -40, 11, -50);
    ctx.quadraticCurveTo(12, -58, 11, -66);
    ctx.closePath(); ctx.fill();
  } else if (hairId === 'hair_pony' || hairId === 'hair_twin' || hairId === 'hair_bun') {
    ctx.fillStyle = HD;
    ctx.beginPath();
    ctx.moveTo(-14, -68);
    ctx.quadraticCurveTo(-16, -55, -15, -42);
    ctx.lineTo(-11, -42);
    ctx.quadraticCurveTo(-11, -55, -10, -66);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(14, -68);
    ctx.quadraticCurveTo(16, -55, 15, -42);
    ctx.lineTo(11, -42);
    ctx.quadraticCurveTo(11, -55, 10, -66);
    ctx.closePath(); ctx.fill();
  }

  ctx.fillStyle = SKIN;
  ctx.fillRect(-7, -18, 5, 32);
  ctx.fillRect(2, -18, 5, 32);

  if (skirtItem.preview === 'pants') {
    ctx.fillStyle = PANTS;
    ctx.beginPath();
    ctx.moveTo(-11, -18); ctx.lineTo(-11, 4); ctx.lineTo(-17, 14);
    ctx.lineTo(-2, 14); ctx.lineTo(-2, -18); ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(11, -18); ctx.lineTo(11, 4); ctx.lineTo(17, 14);
    ctx.lineTo(2, 14); ctx.lineTo(2, -18); ctx.closePath(); ctx.fill();
  } else {
    const c = skirtItem.colors;
    const grad = ctx.createLinearGradient(0, -18, 0, 8);
    grad.addColorStop(0, c[0]); grad.addColorStop(1, c[1]);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(-11, -18); ctx.lineTo(11, -18);
    ctx.quadraticCurveTo(14, -8, 20, 6);
    ctx.quadraticCurveTo(0, 12, -20, 6);
    ctx.quadraticCurveTo(-14, -8, -11, -18);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(-5, -17); ctx.lineTo(-8, 8);
    ctx.moveTo(0, -17); ctx.lineTo(0, 10);
    ctx.moveTo(5, -17); ctx.lineTo(8, 8);
    ctx.stroke();
  }

  ctx.fillStyle = SHOE;
  ctx.beginPath(); ctx.ellipse(-9.5, 14, 8, 4.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(9.5, 14, 8, 4.5, 0, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = BLOUSE;
  ctx.beginPath();
  ctx.moveTo(-11, -42); ctx.lineTo(11, -42);
  ctx.lineTo(12, -17); ctx.lineTo(-12, -17);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = BLOUSE_SHADE;
  ctx.beginPath();
  ctx.moveTo(-3, -42); ctx.lineTo(3, -42);
  ctx.lineTo(2, -17); ctx.lineTo(-2, -17);
  ctx.closePath(); ctx.fill();

  function drawArm(a) {
    ctx.strokeStyle = SKIN;
    ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(a.sx, a.sy); ctx.lineTo(a.ex, a.ey); ctx.stroke();
    const mx = a.sx + (a.ex - a.sx) * 0.55;
    const my = a.sy + (a.ey - a.sy) * 0.55;
    ctx.strokeStyle = BLOUSE;
    ctx.lineWidth = 7.5;
    ctx.beginPath(); ctx.moveTo(a.sx, a.sy); ctx.lineTo(mx, my); ctx.stroke();
  }

  if (accItem && accItem.id === 'acc_cat') {
    ctx.fillStyle = HM;
    ctx.strokeStyle = HD;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-15, -72);
    ctx.quadraticCurveTo(-17, -80, -13, -85);
    ctx.quadraticCurveTo(-7, -82, -5, -72);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(15, -72);
    ctx.quadraticCurveTo(17, -80, 13, -85);
    ctx.quadraticCurveTo(7, -82, 5, -72);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }

  ctx.fillStyle = HD;
  ctx.beginPath(); ctx.ellipse(0, -58, 20, 22, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = SKIN;
  ctx.beginPath(); ctx.ellipse(0, -56, 16, 17, 0, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = HM;
  ctx.beginPath();
  ctx.arc(0, -58, 17, Math.PI * 1.02, Math.PI * 1.98);
  ctx.lineTo(17, -58); ctx.lineTo(-17, -58);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-17, -58);
  ctx.quadraticCurveTo(-15, -50, -13, -48);
  ctx.quadraticCurveTo(-11, -55, -10, -62);
  ctx.quadraticCurveTo(-6, -55, -3, -60);
  ctx.quadraticCurveTo(0, -54, 3, -60);
  ctx.quadraticCurveTo(6, -55, 10, -62);
  ctx.quadraticCurveTo(11, -55, 13, -48);
  ctx.quadraticCurveTo(15, -50, 17, -58);
  ctx.closePath(); ctx.fill();

  ctx.fillStyle = HL;
  ctx.beginPath(); ctx.ellipse(-6, -67, 5, 2, -0.3, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(6, -68, 3.5, 1.5, 0.3, 0, Math.PI * 2); ctx.fill();

  // Причёска-накладка
  if (hairId !== 'default_hair') {
    drawHairExtra(hairId, cfg);
  }

  const eyeY = -55;
  const eyesClosed = (pose === 'eat' && eatPhase > 0.35) || slapped;
  if (eyesClosed) {
    ctx.strokeStyle = '#1a0e05';
    ctx.lineWidth = 2.4;
    ctx.lineCap = 'round';
    if (slapped) {
      ctx.beginPath();
      ctx.moveTo(-10, eyeY - 3); ctx.lineTo(-4, eyeY + 3);
      ctx.moveTo(-4, eyeY - 3); ctx.lineTo(-10, eyeY + 3);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(4, eyeY - 3); ctx.lineTo(10, eyeY + 3);
      ctx.moveTo(10, eyeY - 3); ctx.lineTo(4, eyeY + 3);
      ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(-7, eyeY + 1, 3, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
      ctx.beginPath(); ctx.arc(7, eyeY + 1, 3, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
    }
  } else {
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.ellipse(-7, eyeY, 4.5, 5.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(7, eyeY, 4.5, 5.5, 0, 0, Math.PI * 2); ctx.fill();
    const eg = ctx.createLinearGradient(-7, eyeY - 5, -7, eyeY + 5);
    eg.addColorStop(0, EYE_IRIS_DARK); eg.addColorStop(0.5, EYE_IRIS); eg.addColorStop(1, cfg.eyeIris);
    ctx.fillStyle = eg;
    ctx.beginPath(); ctx.ellipse(-7, eyeY + 0.3, 3.4, 4.7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(7, eyeY + 0.3, 3.4, 4.7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = EYE_PUPIL;
    ctx.beginPath(); ctx.ellipse(-7, eyeY + 0.3, 1.7, 2.7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(7, eyeY + 0.3, 1.7, 2.7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(-8, eyeY - 2, 1.6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(6, eyeY - 2, 1.6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(-6, eyeY + 2.2, 0.8, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(8, eyeY + 2.2, 0.8, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#1a0e05';
    ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.arc(-7, eyeY - 1, 4.5, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
    ctx.beginPath(); ctx.arc(7, eyeY - 1, 4.5, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
  }

  ctx.fillStyle = 'rgba(255,140,160,0.5)';
  ctx.beginPath(); ctx.ellipse(-11, -48, 3.5, 2.2, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(11, -48, 3.5, 2.2, 0, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = '#b8424e';
  if ((pose === 'eat' && eatPhase > 0.25 && eatPhase < 0.85) || slapped) {
    ctx.beginPath(); ctx.ellipse(0, -46, 3.5, 4.5, 0, 0, Math.PI * 2); ctx.fill();
  } else {
    ctx.beginPath(); ctx.arc(0, -47, 2.5, 0, Math.PI); ctx.fill();
  }

  drawArm(arms.left);
  drawArm(arms.right);

  if (accItem && accItem.id === 'acc_scarf') {
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#d8d8e0';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.ellipse(0, -40, 13, 5, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0, -42, 11, 4, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-10, -38);
    ctx.quadraticCurveTo(-14, -30, -12, -20);
    ctx.quadraticCurveTo(-10, -22, -8, -30);
    ctx.quadraticCurveTo(-7, -35, -6, -38);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(6, -38);
    ctx.quadraticCurveTo(10, -32, 9, -22);
    ctx.quadraticCurveTo(12, -28, 13, -38);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }

  ctx.restore();
}

// ============ КОТИК ============
// Толстый пушистый серый кот. Нарисован отдельно.
function drawCat(x, y, scale, fed, time) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);
  const breath = Math.sin(time * 0.002) * 1.5;
  const GRAY = '#a8a8b8';
  const GRAY_D = '#787888';
  const GRAY_L = '#d0d0dc';
  const PINK = '#ffb8c8';
  const EYE = '#3a8a4a';

  // Тень
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.beginPath();
  ctx.ellipse(0, 42, 42, 7, 0, 0, Math.PI * 2);
  ctx.fill();

  // Хвост (пушистый)
  ctx.fillStyle = GRAY;
  ctx.beginPath();
  ctx.moveTo(30, 20);
  ctx.quadraticCurveTo(58, 8, 52, -14);
  ctx.quadraticCurveTo(48, -20, 42, -18);
  ctx.quadraticCurveTo(48, -8, 40, 8);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = GRAY_D; ctx.lineWidth = 1.2; ctx.stroke();

  // Тело (толстое, пушистое) — большое пузико
  ctx.fillStyle = GRAY;
  ctx.beginPath();
  ctx.ellipse(0, 22 + breath, 42, 22, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = GRAY_D;
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Пузико (светлее)
  ctx.fillStyle = GRAY_L;
  ctx.beginPath();
  ctx.ellipse(0, 28 + breath, 26, 13, 0, 0, Math.PI * 2);
  ctx.fill();

  // Передние лапки (короткие толстые)
  ctx.fillStyle = GRAY;
  ctx.beginPath(); ctx.ellipse(-20, 40, 10, 6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = GRAY_D; ctx.lineWidth = 1; ctx.stroke();
  ctx.beginPath(); ctx.ellipse(20, 40, 10, 6, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

  // Розовые подушечки
  ctx.fillStyle = PINK;
  ctx.beginPath(); ctx.arc(-20, 40, 2.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(20, 40, 2.5, 0, Math.PI * 2); ctx.fill();

  // Голова
  ctx.fillStyle = GRAY;
  ctx.beginPath();
  ctx.ellipse(0, -10 + breath, 28, 26, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = GRAY_D; ctx.lineWidth = 1.5; ctx.stroke();

  // Ушки
  ctx.fillStyle = GRAY;
  ctx.beginPath();
  ctx.moveTo(-22, -22 + breath);
  ctx.lineTo(-26, -42 + breath);
  ctx.lineTo(-8, -30 + breath);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = GRAY_D; ctx.lineWidth = 1.2; ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(22, -22 + breath);
  ctx.lineTo(26, -42 + breath);
  ctx.lineTo(8, -30 + breath);
  ctx.closePath(); ctx.fill(); ctx.stroke();

  // Внутренние ушки
  ctx.fillStyle = PINK;
  ctx.beginPath();
  ctx.moveTo(-20, -25 + breath);
  ctx.lineTo(-22, -38 + breath);
  ctx.lineTo(-12, -30 + breath);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(20, -25 + breath);
  ctx.lineTo(22, -38 + breath);
  ctx.lineTo(12, -30 + breath);
  ctx.closePath(); ctx.fill();

  // Глазки
  if (fed) {
    // Сытый — прищуренные довольные
    ctx.strokeStyle = '#1a1a1a';
    ctx.lineWidth = 2.4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(-9, -8 + breath, 4, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(9, -8 + breath, 4, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
  } else {
    // Голодный — большие глазки
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.ellipse(-9, -8 + breath, 6, 7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(9, -8 + breath, 6, 7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = EYE;
    ctx.beginPath(); ctx.ellipse(-9, -7 + breath, 4.2, 5.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(9, -7 + breath, 4.2, 5.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#0d1a0f';
    ctx.beginPath(); ctx.ellipse(-9, -7 + breath, 2.2, 3, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(9, -7 + breath, 2.2, 3, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(-10, -10 + breath, 1.8, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(8, -10 + breath, 1.8, 0, Math.PI * 2); ctx.fill();
  }

  // Носик
  ctx.fillStyle = PINK;
  ctx.beginPath();
  ctx.moveTo(0, -1 + breath);
  ctx.lineTo(-3, -4 + breath);
  ctx.lineTo(3, -4 + breath);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#8a4050'; ctx.lineWidth = 0.8; ctx.stroke();

  // Ротик
  ctx.strokeStyle = '#8a4050';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(0, -1 + breath);
  ctx.lineTo(0, 1 + breath);
  ctx.moveTo(0, 1 + breath);
  ctx.quadraticCurveTo(-3, 4 + breath, -6, 2 + breath);
  ctx.moveTo(0, 1 + breath);
  ctx.quadraticCurveTo(3, 4 + breath, 6, 2 + breath);
  ctx.stroke();

  // Усики
  ctx.strokeStyle = 'rgba(60,60,70,0.6)';
  ctx.lineWidth = 0.9;
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.moveTo(-10, -2 + breath + i * 2);
    ctx.lineTo(-28, -4 + breath + i * 3);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(10, -2 + breath + i * 2);
    ctx.lineTo(28, -4 + breath + i * 3);
    ctx.stroke();
  }

  // Румянец
  ctx.fillStyle = 'rgba(255,140,160,0.35)';
  ctx.beginPath(); ctx.ellipse(-16, 2 + breath, 4, 2.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(16, 2 + breath, 4, 2.5, 0, 0, Math.PI * 2); ctx.fill();

  // Полосочки-полоски
  ctx.strokeStyle = GRAY_D;
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(-16, -34 + breath); ctx.lineTo(-12, -28 + breath); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-12, -35 + breath); ctx.lineTo(-8, -29 + breath); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(16, -34 + breath); ctx.lineTo(12, -28 + breath); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(12, -35 + breath); ctx.lineTo(8, -29 + breath); ctx.stroke();

  ctx.restore();
}

function drawTvorozhok(x, y, scale) {
  ctx.save();
  ctx.translate(x, y); ctx.scale(scale, scale);
  ctx.fillStyle = '#ffb8d9';
  ctx.beginPath();
  ctx.moveTo(-14, 0); ctx.lineTo(14, 0);
  ctx.lineTo(10, 14); ctx.lineTo(-10, 14);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ff5c9a';
  ctx.beginPath(); ctx.ellipse(0, 0, 14, 5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(-5, -1, 4, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(1, -2, 4.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(7, -0.5, 3.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#e11d48';
  ctx.beginPath(); ctx.arc(1, -6, 2.5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawSlipper(x, y, angle, scale) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(angle); ctx.scale(scale, scale);
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.beginPath(); ctx.ellipse(0, 18, 32, 6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#6a3a1a';
  ctx.beginPath(); ctx.ellipse(0, 0, 32, 16, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#3a1a08'; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.fillStyle = '#a86040';
  ctx.beginPath(); ctx.ellipse(0, -3, 30, 13, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#3a1a08'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#7a4020';
  ctx.beginPath();
  ctx.moveTo(-16, -8);
  ctx.quadraticCurveTo(-4, -24, 6, -8);
  ctx.lineTo(10, -5);
  ctx.quadraticCurveTo(2, -18, -10, -5);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#3a1a08'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.restore();
}

function drawSpeechBubble(x, y, text, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.font = '700 15px Fredoka, sans-serif';
  const textW = ctx.measureText(text).width;
  const padX = 14, padY = 10;
  const bw = textW + padX * 2;
  const bh = 22 + padY * 2;
  const bx = x - bw / 2;
  const by = y - bh;
  ctx.fillStyle = '#ffffff';
  ctx.strokeStyle = '#c86a20';
  ctx.lineWidth = 3;
  rr(bx, by, bw, bh, 14);
  ctx.fill(); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x - 8, by + bh - 1);
  ctx.lineTo(x, by + bh + 12);
  ctx.lineTo(x + 8, by + bh - 1);
  ctx.closePath();
  ctx.fillStyle = '#ffffff'; ctx.fill();
  ctx.strokeStyle = '#c86a20';
  ctx.beginPath();
  ctx.moveTo(x - 8, by + bh - 1);
  ctx.lineTo(x, by + bh + 12);
  ctx.lineTo(x + 8, by + bh - 1);
  ctx.stroke();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.moveTo(x - 7, by + bh - 2);
  ctx.lineTo(x + 7, by + bh - 2);
  ctx.lineTo(x, by + bh + 10);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#8a4510';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '700 15px Fredoka, sans-serif';
  ctx.fillText(text, x, by + bh / 2);
  ctx.textBaseline = 'alphabetic';
  ctx.restore();
}

// ============ ЧАСТИЦЫ (снежинки/искорки) ============
const ambientParticles = [];
function initAmbient() {
  ambientParticles.length = 0;
  for (let i = 0; i < 25; i++) {
    ambientParticles.push({
      x: Math.random() * W,
      y: Math.random() * H,
      s: 1 + Math.random() * 2.5,
      vy: 0.2 + Math.random() * 0.5,
      vx: (Math.random() - 0.5) * 0.4,
      tw: Math.random() * Math.PI * 2,
      type: Math.random() < 0.5 ? 'sparkle' : 'petal',
    });
  }
}
initAmbient();
function updateAmbient(dt) {
  for (const p of ambientParticles) {
    p.y += p.vy * (dt / 16);
    p.x += p.vx * (dt / 16) + Math.sin(skyTime * 0.001 + p.tw) * 0.15;
    if (p.y > H + 10) { p.y = -10; p.x = Math.random() * W; }
    if (p.x < -10) p.x = W + 10;
    if (p.x > W + 10) p.x = -10;
  }
}
function drawAmbient(pal) {
  ctx.save();
  for (const p of ambientParticles) {
    if (p.type === 'sparkle') {
      const a = 0.4 + Math.sin(skyTime * 0.003 + p.tw) * 0.4;
      ctx.fillStyle = `rgba(255,255,240,${a})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.s, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillStyle = `rgba(255,220,240,0.5)`;
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, p.s * 1.5, p.s * 0.8, p.tw, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.restore();
}

// ============ РЕЖИМЫ ============
let mode = null;
let state = {};
let coinsAwarded = false;

function startTap() {
  initAudio(); startBgMusic(); sfxClick();
  sonyaSay('Привет!');
  sfxWave();
  mode = 'tap';
  coinsAwarded = false;
  state = {
    score: 0, eatTime: 0, particles: [], floats: [], t: 0,
    sonyaX: W * 0.35, sonyaY: H * 0.72,
    catX: W * 0.7, catY: H * 0.78,
    scale: Math.min(W, H) / 260,
    waveT: 1600,
    catFed: false,
    catEatTime: 0,
  };
  state.scale = Math.max(1.6, Math.min(state.scale, 3));
  scoreEl.textContent = 0;
  hud.classList.remove('hidden');
  menu.classList.add('hidden');
  overlay.classList.add('hidden');
  giveAchievement('first_tap');
}

function updateTap(dt) {
  state.t += dt;
  if (state.eatTime > 0) state.eatTime = Math.max(0, state.eatTime - dt);
  if (state.waveT > 0) state.waveT -= dt;
  if (state.catEatTime > 0) state.catEatTime -= dt;
  for (const p of state.particles) {
    p.x += p.vx; p.y += p.vy; p.vy += 0.08; p.life -= dt / 900;
  }
  state.particles = state.particles.filter(p => p.life > 0);
  for (const f of state.floats) {
    f.y -= dt * 0.08; f.life -= dt / 800;
  }
  state.floats = state.floats.filter(f => f.life > 0);
}

function renderTap() {
  const pal = drawBackground();
  drawStars(pal); drawSunMoon(pal); drawMovingClouds(pal, 0);
  drawAmbient(pal);

  const eatPhase = state.eatTime > 0 ? 1 - state.eatTime / 500 : 0;

  // Подсказка пульса вокруг Сони
  if (state.eatTime <= 0 && state.waveT <= 0) {
    const pulse = 1 + Math.sin(state.t * 0.004) * 0.05;
    ctx.save();
    ctx.translate(state.sonyaX, state.sonyaY - 40 * state.scale);
    ctx.scale(state.scale * pulse, state.scale * pulse);
    ctx.strokeStyle = 'rgba(255,107,157,0.3)';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, -56, 60, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  // Тени
  ctx.fillStyle = 'rgba(180,120,200,0.25)';
  ctx.beginPath();
  ctx.ellipse(state.sonyaX, state.sonyaY + 18 * state.scale, 30 * state.scale, 6 * state.scale, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(state.catX, state.catY + 42 * (state.scale * 0.65), 32 * state.scale, 6 * state.scale, 0, 0, Math.PI * 2);
  ctx.fill();

  // Котик
  drawCat(state.catX, state.catY, state.scale * 0.65, state.catFed || state.catEatTime > 0, state.t);

  // Соня — с анимацией махания при заходе
  const bob = state.eatTime > 0 ? 0 : Math.sin(state.t * 0.005) * 1.5;
  const waveProgress = state.waveT > 0 ? 1 - state.waveT / 1600 : 0;
  const waving = state.waveT > 0;
  // подменяем pose на 'wave' если машет
  const pose = waving ? 'wave' : 'eat';
  drawSonyaWithWave(state.sonyaX, state.sonyaY + bob, state.scale, pose, false, eatPhase, SONYA_CFG, 0, { charKey: 'sonya' }, waveProgress);

  if (eatPhase > 0 && eatPhase < 1) {
    const cx = state.sonyaX + 3 * state.scale;
    const cy = state.sonyaY - 45 * state.scale;
    const sh = 1 - eatPhase;
    if (sh > 0.05) drawTvorozhok(cx, cy, state.scale * 0.9 * sh);
  }

  // Частицы
  ctx.font = `${Math.floor(22 * state.scale * 0.5)}px sans-serif`;
  ctx.textAlign = 'center';
  for (const p of state.particles) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillText(p.emoji, p.x, p.y);
  }
  ctx.globalAlpha = 1;

  // +1
  ctx.font = `900 ${Math.floor(40 * state.scale * 0.4)}px Fredoka, sans-serif`;
  for (const f of state.floats) {
    ctx.globalAlpha = Math.max(0, f.life);
    ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#ff6b9d';
    ctx.lineWidth = 6;
    ctx.strokeText('+1', f.x, f.y);
    ctx.fillText('+1', f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

// Соня с волной (рука вверх)
function drawSonyaWithWave(x, y, scale, pose, flip, eatPhase, cfg, slapped, opts, waveProgress) {
  if (pose === 'wave') {
    // Рисуем обычную Соню, но во время волны рисуем машущую руку
    drawSonya(x, y, scale, 'eat', flip, eatPhase, cfg, slapped, opts);
    // Дополнительно — машущая рука справа
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    const wa = Math.sin(waveProgress * Math.PI * 6) * 0.5;
    ctx.strokeStyle = '#ffe4d0';
    ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(10, -38);
    ctx.lineTo(18 + wa * 4, -58);
    ctx.stroke();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 7.5;
    ctx.beginPath();
    ctx.moveTo(10, -38);
    ctx.lineTo(15 + wa * 2, -50);
    ctx.stroke();
    ctx.restore();
  } else {
    drawSonya(x, y, scale, pose, flip, eatPhase, cfg, slapped, opts);
  }
}

function tapAction(clientX, clientY) {
  if (mode !== 'tap') return;
  const px = clientX != null ? clientX : W / 2;
  const py = clientY != null ? clientY : H / 2;

  // Проверка тапа по котику
  const catDx = px - state.catX;
  const catDy = py - state.catY;
  if (catDx * catDx + catDy * catDy < (40 * state.scale * 0.65) ** 2 * 1.5) {
    // Покормить кота
    if (state.catEatTime > 0) return;
    state.catEatTime = 1200;
    state.catFed = true;
    state.score += 3;
    scoreEl.textContent = state.score;
    sfxMeow();
    playerData.catFeedCount = (playerData.catFeedCount || 0) + 1;
    savePlayerData();
    if (playerData.catFeedCount >= 20) giveAchievement('cat_friend');
    if (playerData.catFeedCount >= 100) giveAchievement('cat_love');
    // Сердечки над котиком
    const hearts = ['💕','💖','❤️','😻','💗'];
    for (let i = 0; i < 6; i++) {
      state.particles.push({
        x: state.catX + (Math.random() - 0.5) * 50,
        y: state.catY - 40 + (Math.random() - 0.5) * 20,
        vx: (Math.random() - 0.5) * 3,
        vy: -2 - Math.random() * 2,
        life: 1,
        emoji: hearts[Math.floor(Math.random() * hearts.length)],
      });
    }
    state.floats.push({ x: state.catX, y: state.catY - 60, life: 1, text: '+3' });
    return;
  }

  // Обычный тап по Соне
  if (state.waveT > 0) return; // пока машет — не едим
  state.eatTime = 500;
  state.score++;
  scoreEl.textContent = state.score;
  sfxEat();

  state.floats.push({ x: px, y: py - 30, life: 1 });

  const emojis = ['💕','✨','🌸','💖','⭐','🩷'];
  for (let i = 0; i < 4; i++) {
    state.particles.push({
      x: state.sonyaX + (Math.random() - 0.5) * 80,
      y: state.sonyaY - 60 + (Math.random() - 0.5) * 40,
      vx: (Math.random() - 0.5) * 4,
      vy: -2 - Math.random() * 3,
      life: 1,
      emoji: emojis[Math.floor(Math.random() * emojis.length)],
    });
  }
  if (state.score > playerData.maxTap) {
    playerData.maxTap = state.score;
    savePlayerData();
  }
  if (state.score >= 100) giveAchievement('tap_100');
  if (state.score >= 500) giveAchievement('tap_500');
}

function startJump() {
  initAudio(); startBgMusic(); sfxClick();
  mode = 'jump';
  coinsAwarded = false;
  state = {
    sonya: { x: W / 2, y: 50 - SONYA_FEET, vy: -16, w: 60 },
    cameraY: -H + 150,
    platforms: [{ x: W / 2 - 70, y: 50, w: 140, h: 16 }],
    nextY: 50, score: 0, minY: 0, running: true, touchX: null, t: 0,
  };
  for (let i = 0; i < 30; i++) addPlatform();
  scoreEl.textContent = 0;
  hud.classList.remove('hidden');
  menu.classList.add('hidden');
  overlay.classList.add('hidden');
}

function addPlatform() {
  const gap = 90 + Math.random() * 45;
  state.nextY -= gap;
  const w = 85 + Math.random() * 45;
  const x = 20 + Math.random() * Math.max(20, W - w - 40);
  state.platforms.push({ x, y: state.nextY, w, h: 14 });
}

function updateJump(dt) {
  if (!state.running) return;
  state.t += dt;
  const s = state.sonya;
  const step = dt / 16.67;
  const prevFeet = s.y + SONYA_FEET;
  s.vy += 0.55 * step;
  s.y += s.vy * step;
  if (state.touchX != null) s.x += (state.touchX - s.x) * 0.22 * step;
  s.x = Math.max(30, Math.min(W - 30, s.x));
  if (s.vy > 0) {
    const currFeet = s.y + SONYA_FEET;
    for (const p of state.platforms) {
      if (prevFeet <= p.y && currFeet >= p.y && s.x > p.x - 20 && s.x < p.x + p.w + 20) {
        s.y = p.y - SONYA_FEET; s.vy = -15; sfxJump(); break;
      }
    }
  }
  if (s.y < state.minY) {
    state.minY = s.y;
    state.score = Math.floor(-state.minY / 10);
    scoreEl.textContent = state.score;
    if (state.score > playerData.maxJump) {
      playerData.maxJump = state.score;
      savePlayerData();
    }
    if (state.score >= 50) giveAchievement('jump_50');
    if (state.score >= 100) giveAchievement('jump_100');
  }
  const target = s.y - H * 0.45;
  if (target < state.cameraY) state.cameraY = target;
  while (state.nextY > state.cameraY - 300) addPlatform();
  state.platforms = state.platforms.filter(p => p.y < state.cameraY + H + 300);
  if (s.y - state.cameraY > H + 80) endJump();
}

function endJump() {
  state.running = false;
  const earned = state.score;
  awardCoins(earned);
  sfxGameOver();
  overlayTitle.textContent = 'ИГРА ОКОНЧЕНА';
  overlayScore.textContent = 'ВЫСОТА: ' + earned;
  overlayCoins.textContent = '+' + earned + ' МОНЕТ';
  overlay.classList.remove('hidden');
}

function renderJump() {
  const pal = drawBackground();
  drawStars(pal); drawSunMoon(pal); drawMovingClouds(pal, state.cameraY);
  for (const p of state.platforms) {
    const py = p.y - state.cameraY;
    if (py < -40 || py > H + 40) continue;
    drawFluffyPlatform(p.x, py, p.w, p.h, pal.darkness);
  }
  const sx = state.sonya.x;
  const sy = state.sonya.y - state.cameraY;
  const scale = Math.min(W, H) / 340;
  const jump = state.sonya.vy < 0;
  const pose = jump ? 'jump' : 'idle';
  let groundY = null;
  for (const p of state.platforms) {
    if (state.sonya.x > p.x - 20 && state.sonya.x < p.x + p.w + 20) {
      const py = p.y - state.cameraY;
      if (py >= sy + SONYA_FEET - 2 && (groundY === null || py < groundY)) groundY = py;
    }
  }
  if (groundY === null) groundY = sy + SONYA_FEET;
  const sd = groundY - (sy + SONYA_FEET);
  const sa = Math.max(0.08, 0.3 - sd / 500);
  const ss = Math.max(0.5, 1 - sd / 500);
  ctx.fillStyle = `rgba(60,40,80,${sa})`;
  ctx.beginPath();
  ctx.ellipse(sx, groundY, 20 * ss, 5 * ss, 0, 0, Math.PI * 2);
  ctx.fill();
  drawSonya(sx, sy, Math.max(1.2, scale), pose, false, 0, SONYA_CFG, 0, { charKey: 'sonya' });
}

function startSlap() {
  initAudio(); startBgMusic(); sfxClick();
  mode = 'slap';
  coinsAwarded = false;
  state = {
    slaps: 0, t: 0, animT: 9999, slapDone: false, shakeAmp: 0,
    veronikaCfg: getVeronikaCfg(), floats: [], particles: [],
    scale: Math.min(W, H) / 260, vX: W / 2, vY: H * 0.7,
  };
  state.scale = Math.max(1.8, Math.min(state.scale, 3.2));
  scoreEl.textContent = 0;
  hud.classList.remove('hidden');
  menu.classList.add('hidden');
  overlay.classList.add('hidden');
}

function updateSlap(dt) {
  state.t += dt;
  if (state.animT < 9999) {
    state.animT += dt;
    if (!state.slapDone && state.animT >= 250) {
      state.slapDone = true;
      state.slaps++;
      scoreEl.textContent = state.slaps;
      sfxSlap();
      state.shakeAmp = 12;
      if (state.slaps === 1) giveAchievement('first_slap');
      if (state.slaps >= 50) giveAchievement('slap_50');
      if (state.slaps > playerData.maxSlap) {
        playerData.maxSlap = state.slaps;
        savePlayerData();
      }
      for (let i = 0; i < 8; i++) {
        const a = Math.random() * Math.PI * 2;
        state.particles.push({
          x: state.vX + 10, y: state.vY - 55 * state.scale,
          vx: Math.cos(a) * 5, vy: Math.sin(a) * 5 - 2, life: 1,
          size: 3 + Math.random() * 3,
          color: ['#ffd93d', '#ff5c8a', '#fff', '#ffb8d9'][Math.floor(Math.random() * 4)],
        });
      }
      state.floats.push({
        x: state.vX + 15, y: state.vY - 80 * state.scale, life: 1,
        text: ['ШЛЁП!', 'БАМ!', 'ХЛОП!', 'ОЙ!'][Math.floor(Math.random() * 4)],
      });
    }
    if (state.animT >= 700) {
      state.animT = 9999;
      state.slapDone = false;
    }
  }
  state.shakeAmp *= 0.85;
  if (state.shakeAmp < 0.3) state.shakeAmp = 0;
  for (const p of state.particles) { p.x += p.vx; p.y += p.vy; p.vy += 0.25; p.life -= dt / 700; }
  state.particles = state.particles.filter(p => p.life > 0);
  for (const f of state.floats) { f.y -= dt * 0.1; f.life -= dt / 800; }
  state.floats = state.floats.filter(f => f.life > 0);
}

function renderSlap() {
  const pal = drawBackground();
  drawStars(pal); drawSunMoon(pal); drawMovingClouds(pal, 0);

  const shake = state.shakeAmp;
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

  ctx.fillStyle = 'rgba(180,120,200,0.25)';
  ctx.beginPath();
  ctx.ellipse(state.vX, state.vY + 18 * state.scale, 30 * state.scale, 6 * state.scale, 0, 0, Math.PI * 2);
  ctx.fill();

  let slapped = 0;
  if (state.animT < 9999) {
    const p = state.animT;
    if (p > 200 && p < 500) slapped = 1 - Math.abs(p - 350) / 150;
  }

  const bob = state.animT < 9999 ? 0 : Math.sin(state.t * 0.005) * 1.5;
  drawSonya(state.vX, state.vY + bob, state.scale, 'idle', false, 0, state.veronikaCfg, slapped, { charKey: 'veronika' });

  if (state.animT > 200 && state.animT < 900) {
    const a = Math.max(0, 1 - (state.animT - 200) / 700);
    ctx.save();
    ctx.translate(state.vX, state.vY);
    ctx.scale(state.scale, state.scale);
    ctx.globalAlpha = a * 0.7;
    ctx.fillStyle = '#e84848';
    ctx.beginPath();
    ctx.ellipse(10, -50, 6, 4.5, 0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.restore();
  }
  ctx.restore();

  if (state.animT < 9999 && state.animT < 700) {
    const p = state.animT / 700;
    let sX, sY, sA, sS;
    const impactX = state.vX + 30 * state.scale;
    const impactY = state.vY - 50 * state.scale;
    const startX = W + 120;
    const startY = H * 0.45;
    if (p < 0.35) {
      const t = p / 0.35;
      const e = 1 - Math.pow(1 - t, 3);
      sX = startX + (impactX - startX) * e;
      sY = startY + (impactY - startY) * e;
      sA = 0.5 - e * 0.5;
      sS = state.scale * 0.85;
    } else if (p < 0.55) {
      const t = (p - 0.35) / 0.2;
      sX = impactX + t * 40; sY = impactY + t * 30; sA = 0.3;
      sS = state.scale * 0.85;
    } else {
      const t = (p - 0.55) / 0.45;
      sX = impactX + 40 + (W + 150 - impactX - 40) * t;
      sY = impactY + 30 - 100 * t;
      sA = -0.3 - t * 0.8;
      sS = state.scale * 0.85 * (1 - t * 0.3);
    }
    drawSlipper(sX, sY, sA, sS);
  }

  for (const p of state.particles) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.textAlign = 'center';
  for (const f of state.floats) {
    ctx.globalAlpha = Math.max(0, f.life);
    ctx.font = `900 ${Math.floor(42 * state.scale * 0.5)}px Archivo Black, sans-serif`;
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#d02020';
    ctx.lineWidth = 7;
    ctx.strokeText(f.text, f.x, f.y);
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;

  if (state.slaps === 0 && state.animT >= 9999) {
    ctx.font = `700 ${Math.floor(18 * state.scale * 0.5)}px Fredoka, sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.strokeStyle = 'rgba(180,20,20,0.9)';
    ctx.lineWidth = 4;
    ctx.strokeText('тапай по экрану 👋', W / 2, H - 40);
    ctx.fillText('тапай по экрану 👋', W / 2, H - 40);
  }
}

function slapAction() {
  if (mode !== 'slap') return;
  if (state.animT < 9999) return;
  if (Math.random() < 0.01) { triggerSecretEnding(); return; }
  state.animT = 0;
  state.slapDone = false;
}

function triggerSecretEnding() {
  sfxSecret();
  awardCoins(state.slaps);
  giveAchievement('secret_end');
  state.t = 0;
  state.endingT = 0;
  state.endingPhase = 'afonya_in';
  state.veronikaX = state.vX;
  state.afonyaX = W + 100;
  state.bubbleAlpha = 0;
  mode = 'ending';
}

function updateEnding(dt) {
  state.t += dt;
  const scale = state.scale;
  if (state.endingPhase === 'afonya_in') {
    const p = Math.min(1, state.endingT / 1500);
    const tx = state.veronikaX + 90 * scale;
    state.afonyaX = (W + 100) + (tx - (W + 100)) * p;
    state.endingT += dt;
    if (p >= 1) { state.endingPhase = 'says'; state.endingT = 0; }
  } else if (state.endingPhase === 'says') {
    const p = Math.min(1, state.endingT / 400);
    state.bubbleAlpha = p;
    state.endingT += dt;
    if (state.endingT > 1800) { state.endingPhase = 'walk_off'; state.endingT = 0; }
  } else if (state.endingPhase === 'walk_off') {
    const p = Math.min(1, state.endingT / 2500);
    state.veronikaX = (W / 2) - (W / 2 + 200) * p;
    state.afonyaX = (W / 2 + 90 * scale) - (W / 2 + 200) * p;
    state.bubbleAlpha = Math.max(0, 1 - p * 2);
    state.endingT += dt;
    if (p >= 1) {
      state.endingPhase = 'done';
      overlayTitle.textContent = '🖤 КОНЕЦ 🖤';
      overlayScore.textContent = 'Афоня забрал Веронику...';
      overlayCoins.textContent = '';
      overlayCoins.style.display = 'none';
      overlayBtn.textContent = 'В МЕНЮ';
      overlay.classList.remove('hidden');
      overlay.dataset.toMenu = '1';
    }
  }
}

function renderEnding() {
  const pal = drawBackground();
  drawStars(pal); drawSunMoon(pal); drawMovingClouds(pal, 0);
  const scale = state.scale;
  const vY = H * 0.7;
  const wb = (state.endingPhase === 'walk_off' || state.endingPhase === 'afonya_in')
    ? Math.abs(Math.sin(state.t * 0.012)) * -3 : 0;
  ctx.fillStyle = 'rgba(180,120,200,0.25)';
  ctx.beginPath();
  ctx.ellipse(state.veronikaX, vY + 18 * scale, 30 * scale, 6 * scale, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(200,140,90,0.25)';
  ctx.beginPath();
  ctx.ellipse(state.afonyaX, vY + 18 * scale, 30 * scale, 6 * scale, 0, 0, Math.PI * 2);
  ctx.fill();
  drawSonya(state.veronikaX, vY + wb, scale, 'idle', false, 0, state.veronikaCfg, 0, { charKey: 'veronika' });
  drawSonya(state.afonyaX, vY + wb, scale, 'idle', true, 0, AFONYA_CFG, 0, {
    skirt: { preview: 'pants', colors: ['#1a1a2a', '#0a0a0a'] },
    acc: null,
    hair: null,
  });
  if (state.bubbleAlpha > 0.01) {
    drawSpeechBubble(state.afonyaX, vY - 100 * scale, 'Я забираю Веронику', state.bubbleAlpha);
  }
  if (state.endingPhase === 'done') {
    ctx.fillStyle = 'rgba(20,10,30,0.6)';
    ctx.fillRect(0, 0, W, H);
  }
}

function awardCoins(amount) {
  if (coinsAwarded || amount <= 0) return;
  coinsAwarded = true;
  playerData.coins += amount;
  savePlayerData();
  updateCoinsUI();
  sfxCoin();
  if (playerData.coins >= 500) giveAchievement('rich_500');
  if (playerData.coins >= 1000) giveAchievement('rich_1000');
}

let lastTime = 0;
function loop(t) {
  const dt = Math.min(50, t - lastTime);
  lastTime = t;
  skyTime += dt;
  updateClouds(dt);
  updateAmbient(dt);

  if (mode === 'tap') { updateTap(dt); renderTap(); }
  else if (mode === 'jump') { updateJump(dt); renderJump(); }
  else if (mode === 'slap') { updateSlap(dt); renderSlap(); }
  else if (mode === 'ending') { updateEnding(dt); renderEnding(); }
  else {
    const pal = drawBackground();
    drawStars(pal); drawSunMoon(pal); drawMovingClouds(pal, 0);
    drawAmbient(pal);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
