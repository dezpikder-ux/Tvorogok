<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ТВОРОЖОК</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none;
      -webkit-tap-highlight-color:transparent;
      font-family:'Fredoka','Trebuchet MS',sans-serif; }
  html, body { width:100%; height:100%; overflow:hidden; }
  body { background:#ffd6e0; }
  #cv { display:block; width:100%; height:100%; touch-action:none; }
  .hud { position:absolute; top:0; left:0; right:0; padding:18px 20px;
    display:flex; justify-content:space-between; align-items:flex-start;
    pointer-events:none; z-index:5; }
  .hud .score { font-family:'Archivo Black', sans-serif; font-size:42px;
    font-weight:900; color:#ffffff;
    text-shadow: 0 0 10px #ffffff, 0 0 25px #ffffff, 0 0 45px #ff6b9d, 0 0 70px #ff6b9d, 4px 4px 0 rgba(120,60,100,0.35);
    line-height:1; }
  .hud .back { pointer-events:auto; padding:10px 18px; font-size:15px;
    font-family:inherit; border:3px solid #ffffff; border-radius:16px;
    background:linear-gradient(135deg, #c4a8ff, #8c5cff); color:#ffffff;
    font-weight:700; box-shadow: 0 5px 0 rgba(90,40,150,0.45), 0 0 18px rgba(255,255,255,0.4);
    cursor:pointer; transition:0.08s; text-transform: uppercase;
    letter-spacing:1px; text-shadow: 0 0 8px rgba(255,255,255,0.9); }
  .hud .back:active { transform:translateY(3px); box-shadow:0 2px 0 rgba(90,40,150,0.45); }
  .menu { position:absolute; inset:0; z-index:10; display:flex; flex-direction:column;
    justify-content:center; align-items:center; gap:16px; pointer-events:none; }
  .menu > * { pointer-events: auto; }
  .menu h1 { font-family:'Archivo Black', sans-serif; font-size:54px; font-weight:900;
    color:#ffffff; margin-bottom:10px; letter-spacing:5px;
    text-shadow: 0 0 6px #ffffff, 0 0 14px #ffffff, 0 0 28px #ffd0e8,
      0 0 48px #ff6b9d, 0 0 80px #ff6b9d, 5px 5px 0 #ff8ec4, 8px 8px 0 rgba(200,60,120,0.35); }
  .menu .btn { width:240px; padding:16px; font-size:20px; font-family:inherit;
    font-weight:700; letter-spacing:4px; text-transform:uppercase;
    border:4px solid #ffffff; border-radius:24px; color:#ffffff; cursor:pointer;
    transition:0.08s;
    text-shadow: 0 0 6px #ffffff, 0 0 14px rgba(255,255,255,0.8), 2px 2px 0 rgba(0,0,0,0.15); }
  .menu .btn.tap { background:linear-gradient(135deg, #ff9ec4, #ff5c9a);
    box-shadow: 0 8px 0 rgba(200,60,120,0.45), inset 0 3px 0 rgba(255,255,255,0.4), 0 0 25px rgba(255,140,200,0.5); }
  .menu .btn.jump { background:linear-gradient(135deg, #c4a8ff, #8c5cff);
    box-shadow: 0 8px 0 rgba(90,40,150,0.45), inset 0 3px 0 rgba(255,255,255,0.4), 0 0 25px rgba(160,120,255,0.5); }
  .menu .btn.slap { background:linear-gradient(135deg, #ff8a8a, #d92a2a);
    box-shadow: 0 8px 0 rgba(140,20,20,0.45), inset 0 3px 0 rgba(255,255,255,0.4), 0 0 25px rgba(255,100,100,0.5); }
  .menu .btn.shop { background:linear-gradient(135deg, #ffd97a, #ffb030);
    box-shadow: 0 8px 0 rgba(180,110,20,0.45), inset 0 3px 0 rgba(255,255,255,0.4), 0 0 25px rgba(255,200,80,0.5); }
  .menu .btn.save { background:linear-gradient(135deg, #a8ffd0, #4cd890);
    box-shadow: 0 8px 0 rgba(30,140,90,0.45), inset 0 3px 0 rgba(255,255,255,0.4), 0 0 25px rgba(100,240,160,0.5); }
  .menu .btn:active { transform:translateY(4px); box-shadow: 0 4px 0 rgba(200,60,120,0.45); }
  .coin-badge { position:absolute; top:22px; right:22px; display:flex; align-items:center;
    gap:8px; padding:8px 16px; background:#ffffff; border:3px solid #ffffff;
    border-radius:24px; box-shadow: 0 4px 0 rgba(180,110,20,0.35), 0 0 18px rgba(255,200,80,0.5);
    font-weight:700; font-size:18px; color:#b87020; letter-spacing:1px; z-index: 11; }
  .coin-icon { width:22px; height:22px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #ffe98a, #ffb030 70%);
    box-shadow: inset 0 -2px 0 rgba(150,80,0,0.4), 0 0 8px rgba(255,200,80,0.8); position:relative; }
  .coin-icon::after { content: ''; position:absolute; inset: 6px 7px; border-radius:50%;
    background: radial-gradient(circle, #ffb030, transparent); }
  .overlay { position:absolute; inset:0; z-index:8; display:flex; flex-direction:column;
    justify-content:center; align-items:center; gap:14px;
    background: rgba(255,214,224,0.94); padding: 30px; }
  .overlay h2 { font-family:'Archivo Black', sans-serif; font-size:42px; font-weight:900;
    color:#ffffff;
    text-shadow: 0 0 6px #ffffff, 0 0 16px #ffffff, 0 0 32px #ffd0e8, 0 0 55px #ff6b9d, 4px 4px 0 #ff8ec4;
    letter-spacing:3px; text-align:center; }
  .overlay .score-line { font-size: 24px; font-weight:700; color:#ffffff;
    text-shadow: 0 0 10px #ffffff, 0 0 22px rgba(255,140,200,0.9); letter-spacing:2px; }
  .overlay .coins-earned { font-size: 22px; font-weight:700; color:#ffffff;
    text-shadow: 0 0 10px #ffffff, 0 0 22px #ffd97a; padding: 8px 22px; border-radius: 20px;
    background: rgba(255,180,50,0.45); border: 3px solid #ffffff; letter-spacing:2px;
    margin-top: 6px; box-shadow: 0 0 25px rgba(255,200,80,0.6); }
  .overlay .btn { padding:14px 34px; font-size:18px; font-family:inherit; font-weight:700;
    letter-spacing:3px; text-transform:uppercase; border:4px solid #ffffff; border-radius:22px;
    background:linear-gradient(135deg, #ff9ec4, #ff5c9a); color:#ffffff; cursor:pointer;
    box-shadow: 0 7px 0 rgba(200,60,120,0.45), inset 0 3px 0 rgba(255,255,255,0.4), 0 0 25px rgba(255,140,200,0.6);
    text-shadow: 0 0 8px #ffffff, 2px 2px 0 rgba(0,0,0,0.15); }
  .overlay .btn:active { transform:translateY(4px); box-shadow: 0 3px 0 rgba(200,60,120,0.45); }
  .shop-modal { position:absolute; inset:0; z-index:20; display:flex;
    align-items:center; justify-content:center; background: rgba(120, 60, 100, 0.55);
    padding: 20px; backdrop-filter: blur(3px); }
  .shop-window { background: linear-gradient(180deg, #ffd6e0 0%, #ffe5cc 55%, #d8d0f0 100%);
    border-radius: 28px; padding: 18px; width: 100%; max-width: 340px; max-height: 75vh;
    display: flex; flex-direction: column;
    box-shadow: 0 20px 60px rgba(120, 60, 100, 0.5), 0 0 0 4px #ffffff, 0 0 40px rgba(255,180,220,0.6);
    border: 3px solid rgba(255,255,255,0.6); position: relative; }
  .shop-header { display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 14px; gap: 10px; }
  .shop-header .back-icon { width:42px; height:42px; border-radius:50%;
    border:3px solid #ffffff; background:linear-gradient(135deg, #c4a8ff, #8c5cff);
    color:#ffffff; font-size:20px; font-weight:700;
    box-shadow: 0 4px 0 rgba(90,40,150,0.45), 0 0 15px rgba(160,120,255,0.6);
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    padding-bottom: 3px; flex-shrink: 0; }
  .shop-header .back-icon:active { transform:translateY(3px); box-shadow: 0 1px 0 rgba(90,40,150,0.45); }
  .shop-header h2 { font-family:'Archivo Black', sans-serif; font-size:24px; font-weight:900;
    color:#ffffff;
    text-shadow: 0 0 8px #ffffff, 0 0 18px #ffffff, 0 0 32px #ffd0e8, 0 0 50px #ff6b9d, 3px 3px 0 #ff8ec4;
    letter-spacing:4px; flex: 1; text-align: center; }
  .shop-items { flex:1; overflow-y:auto; display:grid; grid-template-columns: 1fr 1fr;
    gap: 10px; padding: 4px; -webkit-overflow-scrolling: touch; }
  .shop-items::-webkit-scrollbar { width: 0; }
  .shop-item { background: #fff; border-radius: 18px; padding: 10px; text-align: center;
    box-shadow: 0 4px 0 rgba(200,60,120,0.3), 0 0 18px rgba(255,180,220,0.4);
    display: flex; flex-direction: column; gap: 6px; border: 3px solid #ffffff; }
  .shop-item.equipped { box-shadow: 0 4px 0 rgba(200,60,120,0.3), 0 0 0 3px #ffb030, 0 0 25px rgba(255,180,50,0.7); }
  .shop-item-preview { height: 60px; border-radius: 14px; display: flex;
    align-items: center; justify-content: center;
    background: linear-gradient(180deg, #fff5fa, #ffe8f2); overflow: hidden; position: relative; }
  .shop-item-name { font-size: 11px; font-weight: 700; color: #5a2a4a;
    text-transform: uppercase; letter-spacing: 0.5px; min-height: 28px;
    display: flex; align-items: center; justify-content: center; line-height: 1.2; }
  .shop-item-desc { font-size: 9px; font-weight: 500; color: #9a6a8a;
    font-style: italic; letter-spacing: 0.3px; line-height: 1.2; min-height: 22px;
    display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 2px; }
  .shop-item-btn { padding: 8px; border-radius: 12px; border: none; font-family: inherit;
    font-weight: 700; font-size: 12px; cursor: pointer; text-transform: uppercase;
    letter-spacing: 1px; background: linear-gradient(135deg, #ff9ec4, #ff5c9a);
    color: #fff; box-shadow: 0 3px 0 rgba(200,60,120,0.4), 0 0 12px rgba(255,140,200,0.5);
    text-shadow: 0 0 6px rgba(255,255,255,0.7); }
  .shop-item-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(200,60,120,0.4); }
  .shop-item-btn.buy { background: linear-gradient(135deg, #ffd97a, #ffb030);
    color: #ffffff; box-shadow: 0 3px 0 rgba(180,110,20,0.45), 0 0 12px rgba(255,200,80,0.6); }
  .shop-item-btn.equip { background: linear-gradient(135deg, #a8ffd0, #4cd890);
    box-shadow: 0 3px 0 rgba(30,140,90,0.45), 0 0 12px rgba(100,240,160,0.6); }
  .shop-item-btn:disabled { background: #d8d8e0; color: #9a9aa8;
    box-shadow: 0 3px 0 rgba(0,0,0,0.08); cursor: default; text-shadow: none; }
  .shop-item-btn:disabled:active { transform: none; box-shadow: 0 3px 0 rgba(0,0,0,0.08); }
  .hidden { display:none !important; }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div class="hud hidden" id="hud">
  <div class="score" id="score">0</div>
  <button class="back" id="backBtn">← НАЗАД</button>
</div>

<div class="menu" id="menu">
  <h1>ТВОРОЖОК</h1>
  <button class="btn tap" id="mode1">ТАПАТЬ</button>
  <button class="btn jump" id="mode2">ПРЫГАТЬ</button>
  <button class="btn slap" id="mode3">ШЛЁПАТЬ</button>
  <button class="btn shop" id="shopBtn">МАГАЗИН</button>
  <button class="btn save" id="saveBtn">СОХРАНИТЬ</button>
  <div class="coin-badge">
    <div class="coin-icon"></div>
    <span id="menuCoins">0</span>
  </div>
</div>

<div class="shop-modal hidden" id="shop">
  <div class="shop-window">
    <div class="shop-header">
      <button class="back-icon" id="shopBack">←</button>
      <h2>МАГАЗИН</h2>
      <div class="coin-badge" style="position:static; flex-shrink:0;">
        <div class="coin-icon"></div>
        <span id="shopCoins">0</span>
      </div>
    </div>
    <div class="shop-items" id="shopItems"></div>
  </div>
</div>

<div class="overlay hidden" id="overlay">
  <h2 id="overlayTitle"></h2>
  <div class="score-line" id="overlayScore"></div>
  <div class="coins-earned" id="overlayCoins"></div>
  <button class="btn" id="overlayBtn">ЕЩЁ РАЗ</button>
</div>

<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const hud = document.getElementById('hud');
const menu = document.getElementById('menu');
const shop = document.getElementById('shop');
const shopItems = document.getElementById('shopItems');
const scoreEl = document.getElementById('score');
const backBtn = document.getElementById('backBtn');
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlayTitle');
const overlayScore = document.getElementById('overlayScore');
const overlayCoins = document.getElementById('overlayCoins');
const overlayBtn = document.getElementById('overlayBtn');
const menuCoins = document.getElementById('menuCoins');
const shopCoins = document.getElementById('shopCoins');

let audioCtx = null;
let musicStarted = false;
let currentChord = 0;
let melodyStep = 0;
let chordTimer = null;

function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
}

const CHORDS = [
  [261.63, 329.63, 392.00],
  [220.00, 261.63, 329.63],
  [174.61, 220.00, 261.63],
  [196.00, 246.94, 293.66],
];
const MELODY_NOTES = [
  523.25, 587.33, 659.25, 587.33, 523.25, 493.88, 440.00, 493.88,
  523.25, 587.33, 659.25, 783.99, 659.25, 587.33, 523.25, 440.00
];

function playNote(freq, dur, vol, type) {
  if (!audioCtx) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, audioCtx.currentTime);
  g.gain.setValueAtTime(0, audioCtx.currentTime);
  g.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + 0.05);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + dur);
}

function playChord() {
  if (!audioCtx) return;
  const chord = CHORDS[currentChord];
  chord.forEach((freq, i) => {
    setTimeout(() => playNote(freq, 2.5, 0.035, 'sine'), i * 30);
    setTimeout(() => playNote(freq * 2, 2.0, 0.012, 'triangle'), i * 30);
  });
  for (let i = 0; i < 4; i++) {
    const noteIdx = (melodyStep * 4 + i) % MELODY_NOTES.length;
    setTimeout(() => playNote(MELODY_NOTES[noteIdx], 0.9, 0.025, 'sine'), i * 500);
  }
  melodyStep++;
  currentChord = (currentChord + 1) % CHORDS.length;
}

function startBgMusic() {
  if (musicStarted) return;
  initAudio();
  if (!audioCtx) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  musicStarted = true;
  playChord();
  chordTimer = setInterval(playChord, 2000);
}

function playTone(freq, dur, type, vol, slide) {
  initAudio();
  if (!audioCtx) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, audioCtx.currentTime);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, audioCtx.currentTime + dur);
  g.gain.setValueAtTime(vol || 0.15, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + dur);
}

function sfxEat() { playTone(500, 0.12, 'sine', 0.15, 900); setTimeout(() => playTone(700, 0.1, 'sine', 0.12, 1000), 60); }
function sfxJump() { playTone(400, 0.15, 'triangle', 0.13, 750); }
function sfxCoin() { playTone(880, 0.08, 'sine', 0.12); setTimeout(() => playTone(1320, 0.12, 'sine', 0.12), 70); }
function sfxClick() { playTone(600, 0.06, 'square', 0.08); }
function sfxBuy() { playTone(600, 0.08, 'sine', 0.13); setTimeout(() => playTone(800, 0.08, 'sine', 0.13), 70); setTimeout(() => playTone(1000, 0.15, 'sine', 0.13), 140); }
function sfxGameOver() { playTone(500, 0.15, 'sawtooth', 0.1); setTimeout(() => playTone(400, 0.15, 'sawtooth', 0.1), 100); setTimeout(() => playTone(300, 0.3, 'sawtooth', 0.1), 200); }
function sfxSlap() {
  if (!audioCtx) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const bufferSize = audioCtx.sampleRate * 0.1;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 3);
  }
  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = 1500;
  filter.Q.value = 1;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.25, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
  noise.connect(filter); filter.connect(g); g.connect(audioCtx.destination);
  noise.start();
  playTone(180, 0.12, 'sawtooth', 0.1, 90);
}

let W, H, dpr;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
window.addEventListener('resize', resize);

const SHOP_ITEMS = [
  { id: 'default_skirt', name: 'ЧЁРНЫЕ БРЮКИ', price: 0, type: 'skirt', isDefault: true, preview: 'pants' },
  { id: 'skirt_pink', name: 'РОЗОВАЯ ЮБКА', price: 50, type: 'skirt', colors: ['#ffb8d9', '#ff5c9a'], preview: 'skirt' },
  { id: 'skirt_black', name: 'ЧЁРНАЯ ЮБКА', price: 80, type: 'skirt', colors: ['#3a3a3a', '#0a0a0a'], preview: 'skirt' },
  { id: 'default_acc', name: 'БЕЗ АКСЕССУАРА', price: 0, type: 'accessory', isDefault: true, preview: 'none' },
  { id: 'acc_cat', name: 'КОШАЧЬИ УШКИ', price: 150, type: 'accessory', preview: 'catEars', desc: 'будь кошкодевочкой' },
  { id: 'acc_scarf', name: 'БЕЛЫЙ ШАРФИК', price: 100, type: 'accessory', preview: 'scarf', desc: 'уютно и тепло' },
  { id: 'acc_rus_cap', name: 'КЕПКА ТРИКОЛОР', price: 220, type: 'accessory', preview: 'rusCap', desc: 'три цвета флага' },
];

let playerData = {
  coins: 0,
  owned: ['default_skirt', 'default_acc'],
  equipped: { skirt: 'default_skirt', accessory: 'default_acc' }
};

function loadPlayerData() {
  try {
    const raw = localStorage.getItem('tvorozhok_data');
    if (raw) {
      const data = JSON.parse(raw);
      playerData.coins = data.coins || 0;
      playerData.owned = Array.isArray(data.owned) ? data.owned : ['default_skirt', 'default_acc'];
      if (!playerData.owned.includes('default_skirt')) playerData.owned.push('default_skirt');
      if (!playerData.owned.includes('default_acc')) playerData.owned.push('default_acc');
      playerData.equipped = data.equipped || { skirt: 'default_skirt', accessory: 'default_acc' };
    }
  } catch(e) { console.warn(e); }
  updateCoinsUI();
}
function savePlayerData() {
  try { localStorage.setItem('tvorozhok_data', JSON.stringify(playerData)); } catch(e) {}
}
function updateCoinsUI() {
  menuCoins.textContent = playerData.coins;
  shopCoins.textContent = playerData.coins;
}
loadPlayerData();

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

let skyTime = 0;
const DAY_CYCLE = 45000;
function getSkyPhase() { return (skyTime % DAY_CYCLE) / DAY_CYCLE; }
function lerp(a, b, t) { return a + (b - a) * t; }
function lerpColor(c1, c2, t) {
  return [Math.round(lerp(c1[0], c2[0], t)), Math.round(lerp(c1[1], c2[1], t)), Math.round(lerp(c1[2], c2[2], t))];
}
function rgb(c) { return `rgb(${c[0]},${c[1]},${c[2]})`; }

const SKY_PALETTES = {
  day:   { top:[135,206,250], mid:[255,229,204], bot:[216,208,240], isNight:false },
  sunset:{ top:[255,150,150], mid:[255,180,140], bot:[200,140,200], isNight:false },
  night: { top:[20,30,70],    mid:[40,50,100],  bot:[70,60,120],  isNight:true  },
  dawn:  { top:[200,160,220], mid:[255,200,180], bot:[255,180,200], isNight:false }
};

function getSkyPalette() {
  const p = getSkyPhase();
  let from, to, t;
  if (p < 0.35) { from = SKY_PALETTES.day; to = SKY_PALETTES.day; t = 0; }
  else if (p < 0.5) { from = SKY_PALETTES.day; to = SKY_PALETTES.sunset; t = (p - 0.35) / 0.15; }
  else if (p < 0.6) { from = SKY_PALETTES.sunset; to = SKY_PALETTES.night; t = (p - 0.5) / 0.1; }
  else if (p < 0.65) { from = SKY_PALETTES.night; to = SKY_PALETTES.night; t = 0; }
  else if (p < 0.8) { from = SKY_PALETTES.night; to = SKY_PALETTES.dawn; t = (p - 0.65) / 0.15; }
  else { from = SKY_PALETTES.dawn; to = SKY_PALETTES.day; t = (p - 0.8) / 0.2; }
  return {
    top: rgb(lerpColor(from.top, to.top, t)),
    mid: rgb(lerpColor(from.mid, to.mid, t)),
    bot: rgb(lerpColor(from.bot, to.bot, t)),
    darkness: lerp(from.isNight ? 1 : 0, to.isNight ? 1 : 0, t)
  };
}

function drawSky() {
  const pal = getSkyPalette();
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, pal.top);
  g.addColorStop(0.55, pal.mid);
  g.addColorStop(1, pal.bot);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  return pal;
}

const clouds = [];
function initClouds() {
  clouds.length = 0;
  for (let i = 0; i < 10; i++) {
    clouds.push({
      x: Math.random() * (W + 200) - 100,
      y: 60 + Math.random() * (H * 0.7),
      s: 0.6 + Math.random() * 0.9,
      speed: 0.15 + Math.random() * 0.35,
      alpha: 0.5 + Math.random() * 0.4,
      layer: Math.random() < 0.5 ? 1 : 2
    });
  }
}
initClouds();

function updateClouds(dt) {
  for (const c of clouds) {
    c.x += c.speed * dt * 0.06 * c.layer;
    if (c.x - 100 > W) {
      c.x = -100;
      c.y = 60 + Math.random() * (H * 0.7);
      c.s = 0.6 + Math.random() * 0.9;
      c.speed = 0.15 + Math.random() * 0.35;
      c.alpha = 0.5 + Math.random() * 0.4;
      c.layer = Math.random() < 0.5 ? 1 : 2;
    }
  }
}

function drawCloudShape(x, y, s, color) {
  ctx.save();
  ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(0, 0, 22, 0, Math.PI * 2);
  ctx.arc(22, 6, 16, 0, Math.PI * 2);
  ctx.arc(-22, 6, 16, 0, Math.PI * 2);
  ctx.arc(0, 10, 18, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawMovingClouds(pal, camY) {
  camY = camY || 0;
  const isNight = pal.darkness > 0.5;
  for (const c of clouds) {
    let y = c.y - camY * (0.15 + c.layer * 0.1);
    if (y < -100) y += H + 300;
    if (y > H + 100) y -= H + 300;
    let color;
    if (isNight) color = `rgba(180,190,220,${c.alpha * 0.5})`;
    else color = `rgba(255,255,255,${c.alpha * (1 - pal.darkness * 0.7)})`;
    drawCloudShape(c.x, y, c.s, color);
  }
}

const stars = [];
for (let i = 0; i < 40; i++) {
  stars.push({ x: Math.random(), y: Math.random(), s: Math.random() * 1.5 + 0.5, tw: Math.random() * Math.PI * 2 });
}
function drawStars(pal) {
  if (pal.darkness < 0.1) return;
  ctx.save();
  for (const s of stars) {
    const tw = 0.5 + Math.sin(skyTime * 0.003 + s.tw) * 0.5;
    ctx.fillStyle = `rgba(255,255,240,${pal.darkness * tw * 0.9})`;
    ctx.beginPath();
    ctx.arc(s.x * W, s.y * H * 0.6, s.s, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawSunMoon(pal) {
  const p = getSkyPhase();
  if (p < 0.5) {
    const sp = p / 0.5;
    const x = W * sp;
    const y = H * 0.35 - Math.sin(sp * Math.PI) * H * 0.28;
    const alpha = Math.max(0, 1 - Math.abs(p - 0.25) / 0.25);
    ctx.save();
    ctx.shadowColor = 'rgba(255,220,100,0.9)';
    ctx.shadowBlur = 40;
    ctx.fillStyle = `rgba(255,240,150,${alpha})`;
    ctx.beginPath(); ctx.arc(x, y, 40, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  } else {
    const sp = (p - 0.5) / 0.5;
    const x = W * (1 - sp);
    const y = H * 0.35 - Math.sin(sp * Math.PI) * H * 0.28;
    const alpha = Math.max(0, 1 - Math.abs(p - 0.75) / 0.25);
    ctx.save();
    ctx.shadowColor = 'rgba(200,210,255,0.9)';
    ctx.shadowBlur = 30;
    ctx.fillStyle = `rgba(240,240,255,${alpha})`;
    ctx.beginPath(); ctx.arc(x, y, 32, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = `rgba(200,200,230,${alpha * 0.5})`;
    ctx.beginPath(); ctx.arc(x - 8, y - 5, 5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 6, y + 6, 3.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 2, y - 10, 2.5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

function drawFluffyPlatform(x, y, w, h, darkness) {
  ctx.save();
  ctx.shadowColor = darkness > 0.5 ? 'rgba(120,100,180,0.5)' : 'rgba(255,140,180,0.35)';
  ctx.shadowBlur = 10; ctx.shadowOffsetY = 3;
  const grad = ctx.createLinearGradient(x, y, x, y + h);
  if (darkness > 0.5) {
    grad.addColorStop(0, '#a0a0c0'); grad.addColorStop(0.5, '#8888b0'); grad.addColorStop(1, '#6868a0');
  } else {
    grad.addColorStop(0, '#ffffff'); grad.addColorStop(0.5, '#ffe4f0'); grad.addColorStop(1, '#ffb8d9');
  }
  ctx.fillStyle = grad;
  const r = h / 2;
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y);
  ctx.arc(x + w - r, y + r, r, -Math.PI/2, Math.PI/2);
  ctx.lineTo(x + r, y + h);
  ctx.arc(x + r, y + r, r, Math.PI/2, -Math.PI/2);
  ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  ctx.fillStyle = darkness > 0.5 ? '#b0b0d0' : '#ffffff';
  const bumpCount = Math.floor(w / 12);
  for (let i = 0; i < bumpCount; i++) {
    ctx.beginPath();
    ctx.arc(x + 8 + i * 12, y + 1, 4 + (i % 2) * 1.5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.fillStyle = darkness > 0.5 ? 'rgba(200,200,255,0.8)' : 'rgba(255,220,120,0.9)';
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.arc(x + 15 + (i * (w - 30) / 2), y - 3, 1.5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

  ctx.fillStyle = '#ff5c9a';
  ctx.beginPath(); ctx.ellipse(0, 0, 14, 5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(-5, -1, 4, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(1, -2, 4.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(7, -0.5, 3.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#e11d48';
  ctx.beginPath(); ctx.arc(1, -6, 2.5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawSlipper(x, y, angle, scale) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.scale(scale, scale);

  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.beginPath(); ctx.ellipse(0, 18, 32, 6, 0, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = '#6a3a1a';
  ctx.beginPath(); ctx.ellipse(0, 0, 32, 16, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#3a1a08';
  ctx.lineWidth = 2.5; ctx.stroke();

  ctx.fillStyle = '#a86040';
  ctx.beginPath(); ctx.ellipse(0, -3, 30, 13, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#3a1a08'; ctx.lineWidth = 2; ctx.stroke();

  ctx.fillStyle = '#7a4020';
  ctx.beginPath();
  ctx.moveTo(-16, -8);
  ctx.quadraticCurveTo(-4, -24, 6, -8);
  ctx.lineTo(10, -5);
  ctx.quadraticCurveTo(2, -18, -10, -5);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#3a1a08'; ctx.lineWidth = 1.5; ctx.stroke();

  ctx.fillStyle = 'rgba(255,220,180,0.35)';
  ctx.beginPath(); ctx.ellipse(-8, -6, 8, 3, -0.3, 0, Math.PI * 2); ctx.fill();

  ctx.restore();
}

let mode = null;
let state = {};
let coinsAwarded = false;

function startTap() {
  initAudio(); startBgMusic(); sfxClick();
  mode = 'tap';
  coinsAwarded = false;
  state = {
    score: 0, eatTime: 0, particles: [], floats: [], t: 0,
    sonyaX: W / 2, sonyaY: H * 0.72,
    scale: Math.min(W, H) / 260,
  };
  state.scale = Math.max(1.8, Math.min(state.scale, 3.2));
  scoreEl.textContent = 0;
  hud.classList.remove('hidden');
  menu.classList.add('hidden');
  overlay.classList.add('hidden');
}

function updateTap(dt) {
  state.t += dt;
  if (state.eatTime > 0) state.eatTime = Math.max(0, state.eatTime - dt);
  for (const p of state.particles) {
    p.x += p.vx; p.y += p.vy; p.vy += 0.08; p.life -= dt / 900;
  }
  state.particles = state.particles.filter(p => p.life > 0);
  for (const f of state.floats) {
    f.y -= dt * 0.08; f.life -= dt / 800;
  }
  state.floats = state.floats.filter(f => f.life > 0);
}

function renderTap() {
  const pal = drawSky();
  drawStars(pal); drawSunMoon(pal); drawMovingClouds(pal, 0);
  const eatPhase = state.eatTime > 0 ? 1 - state.eatTime / 500 : 0;
  if (state.eatTime <= 0) {
    const pulse = 1 + Math.sin(state.t * 0.004) * 0.05;
    ctx.save();
    ctx.translate(state.sonyaX, state.sonyaY - 40 * state.scale);
    ctx.scale(state.scale * pulse, state.scale * pulse);
    ctx.strokeStyle = 'rgba(255,107,157,0.3)';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, -56, 60, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
  ctx.fillStyle = 'rgba(180,120,200,0.25)';
  ctx.beginPath();
  ctx.ellipse(state.sonyaX, state.sonyaY + 18 * state.scale, 30 * state.scale, 6 * state.scale, 0, 0, Math.PI * 2);
  ctx.fill();
  const bob = state.eatTime > 0 ? 0 : Math.sin(state.t * 0.005) * 1.5;
  drawSonya(state.sonyaX, state.sonyaY + bob, state.scale, 'eat', false, eatPhase, SONYA_CFG, 0);
  if (eatPhase > 0 && eatPhase < 1) {
    const cx = state.sonyaX + 3 * state.scale;
    const cy = state.sonyaY - 45 * state.scale;
    const sh = 1 - eatPhase;
    if (sh > 0.05) drawTvorozhok(cx, cy, state.scale * 0.9 * sh);
  }
  ctx.font = `${Math.floor(22 * state.scale * 0.5)}px sans-serif`;
  ctx.textAlign = 'center';
  for (const p of state.particles) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillText(p.emoji, p.x, p.y);
  }
  ctx.globalAlpha = 1;
  ctx.font = `900 ${Math.floor(40 * state.scale * 0.4)}px Fredoka, sans-serif`;
  for (const f of state.floats) {
    ctx.globalAlpha = Math.max(0, f.life);
    ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#ff6b9d';
    ctx.lineWidth = 6;
    ctx.strokeText('+1', f.x, f.y);
    ctx.fillText('+1', f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

function tapAction() {
  if (mode !== 'tap') return;
  state.eatTime = 500;
  state.score++;
  scoreEl.textContent = state.score;
  sfxEat();
  const emojis = ['💕','✨','🌸','💖','⭐','🩷'];
  for (let i = 0; i < 4; i++) {
    state.particles.push({
      x: state.sonyaX + (Math.random() - 0.5) * 80,
      y: state.sonyaY - 60 + (Math.random() - 0.5) * 40,
      vx: (Math.random() - 0.5) * 4,
      vy: -2 - Math.random() * 3,
      life: 1,
      emoji: emojis[Math.floor(Math.random() * emojis.length)],
    });
  }
}

function startJump() {
  initAudio(); startBgMusic(); sfxClick();
  mode = 'jump';
  coinsAwarded = false;
  state = {
    sonya: { x: W / 2, y: 50 - SONYA_FEET, vy: -16, w: 60 },
    cameraY: -H + 150,
    platforms: [{ x: W / 2 - 70, y: 50, w: 140, h: 16 }],
    nextY: 50, score: 0, minY: 0, running: true, touchX: null, t: 0,
  };
  for (let i = 0; i < 30; i++) addPlatform();
  scoreEl.textContent = 0;
  hud.classList.remove('hidden');
  menu.classList.add('hidden');
  overlay.classList.add('hidden');
}

function addPlatform() {
  const gap = 90 + Math.random() * 45;
  state.nextY -= gap;
  const w = 85 + Math.random() * 45;
  const x = 20 + Math.random() * Math.max(20, W - w - 40);
  state.platforms.push({ x, y: state.nextY, w, h: 14 });
}

function updateJump(dt) {
  if (!state.running) return;
  state.t += dt;
  const s = state.sonya;
  const step = dt / 16.67;
  const prevFeet = s.y + SONYA_FEET;
  s.vy += 0.55 * step;
  s.y += s.vy * step;
  if (state.touchX != null) s.x += (state.touchX - s.x) * 0.22 * step;
  s.x = Math.max(30, Math.min(W - 30, s.x));
  if (s.vy > 0) {
    const currFeet = s.y + SONYA_FEET;
    for (const p of state.platforms) {
      if (prevFeet <= p.y && currFeet >= p.y && s.x > p.x - 20 && s.x < p.x + p.w + 20) {
        s.y = p.y - SONYA_FEET; s.vy = -15; sfxJump(); break;
      }
    }
  }
  if (s.y < state.minY) {
    state.minY = s.y;
    state.score = Math.floor(-state.minY / 10);
    scoreEl.textContent = state.score;
  }
  const target = s.y - H * 0.45;
  if (target < state.cameraY) state.cameraY = target;
  while (state.nextY > state.cameraY - 300) addPlatform();
  state.platforms = state.platforms.filter(p => p.y < state.cameraY + H + 300);
  if (s.y - state.cameraY > H + 80) endJump();
}

function endJump() {
  state.running = false;
  const earned = state.score;
  awardCoins(earned);
  sfxGameOver();
  overlayTitle.textContent = 'ИГРА ОКОНЧЕНА';
  overlayScore.textContent = 'ВЫСОТА: ' + earned;
  overlayCoins.textContent = '+' + earned + ' МОНЕТ';
  overlay.classList.remove('hidden');
}

function renderJump() {
  const pal = drawSky();
  drawStars(pal); drawSunMoon(pal); drawMovingClouds(pal, state.cameraY);
  for (const p of state.platforms) {
    const py = p.y - state.cameraY;
    if (py < -40 || py > H + 40) continue;
    drawFluffyPlatform(p.x, py, p.w, p.h, pal.darkness);
  }
  const sx = state.sonya.x;
  const sy = state.sonya.y - state.cameraY;
  const scale = Math.min(W, H) / 340;
  const jump = state.sonya.vy < 0;
  const pose = jump ? 'jump' : 'idle';
  let groundY = null;
  for (const p of state.platforms) {
    if (state.sonya.x > p.x - 20 && state.sonya.x < p.x + p.w + 20) {
      const py = p.y - state.cameraY;
      if (py >= sy + SONYA_FEET - 2 && (groundY === null || py < groundY)) groundY = py;
    }
  }
  if (groundY === null) groundY = sy + SONYA_FEET;
  const shadowDist = groundY - (sy + SONYA_FEET);
  const shadowAlpha = Math.max(0.08, 0.3 - shadowDist / 500);
  const shadowScale = Math.max(0.5, 1 - shadowDist / 500);
  ctx.fillStyle = `rgba(60,40,80,${shadowAlpha})`;
  ctx.beginPath();
  ctx.ellipse(sx, groundY, 20 * shadowScale, 5 * shadowScale, 0, 0, Math.PI * 2);
  ctx.fill();
  drawSonya(sx, sy, Math.max(1.2, scale), pose, false, 0, SONYA_CFG, 0);
}

function startSlap() {
  initAudio(); startBgMusic(); sfxClick();
  mode = 'slap';
  coinsAwarded = false;
  state = {
    slaps: 0,
    t: 0,
    animT: 9999,
    slapDone: false,
    shakeAmp: 0,
    veronikaCfg: getVeronikaCfg(),
    floats: [],
    particles: [],
    scale: Math.min(W, H) / 260,
    vX: W / 2,
    vY: H * 0.7,
  };
  state.scale = Math.max(1.8, Math.min(state.scale, 3.2));
  scoreEl.textContent = 0;
  hud.classList.remove('hidden');
  menu.classList.add('hidden');
  overlay.classList.add('hidden');
}

function updateSlap(dt) {
  state.t += dt;
  if (state.animT < 9999) {
    state.animT += dt;
    if (!state.slapDone && state.animT >= 250) {
      state.slapDone = true;
      state.slaps++;
      scoreEl.textContent = state.slaps;
      sfxSlap();
      state.shakeAmp = 12;
      for (let i = 0; i < 8; i++) {
        const a = Math.random() * Math.PI * 2;
        state.particles.push({
          x: state.vX + 10,
          y: state.vY - 55 * state.scale,
          vx: Math.cos(a) * 5,
          vy: Math.sin(a) * 5 - 2,
          life: 1,
          size: 3 + Math.random() * 3,
          color: ['#ffd93d', '#ff5c8a', '#fff', '#ffb8d9'][Math.floor(Math.random() * 4)],
        });
      }
      state.floats.push({
        x: state.vX + 15,
        y: state.vY - 80 * state.scale,
        life: 1,
        text: ['ШЛЁП!', 'БАМ!', 'ХЛОП!', 'ОЙ!'][Math.floor(Math.random() * 4)],
      });
    }
    if (state.animT >= 700) {
      state.animT = 9999;
      state.slapDone = false;
    }
  }
  state.shakeAmp *= 0.85;
  if (state.shakeAmp < 0.3) state.shakeAmp = 0;

  for (const p of state.particles) {
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.25;
    p.life -= dt / 700;
  }
  state.particles = state.particles.filter(p => p.life > 0);

  for (const f of state.floats) {
    f.y -= dt * 0.1;
    f.life -= dt / 800;
  }
  state.floats = state.floats.filter(f => f.life > 0);
}

function renderSlap() {
  const pal = drawSky();
  drawStars(pal); drawSunMoon(pal); drawMovingClouds(pal, 0);

  const shake = state.shakeAmp;
  ctx.save();
  if (shake > 0) {
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  }

  ctx.fillStyle = 'rgba(180,120,200,0.25)';
  ctx.beginPath();
  ctx.ellipse(state.vX, state.vY + 18 * state.scale, 30 * state.scale, 6 * state.scale, 0, 0, Math.PI * 2);
  ctx.fill();

  let slapped = 0;
  if (state.animT < 9999) {
    const p = state.animT;
    if (p > 200 && p < 500) {
      slapped = 1 - Math.abs(p - 350) / 150;
    }
  }

  const bob = state.animT < 9999 ? 0 : Math.sin(state.t * 0.005) * 1.5;
  drawSonya(state.vX, state.vY + bob, state.scale, 'idle', false, 0, state.veronikaCfg, slapped);

  if (state.animT > 200 && state.animT < 900) {
    const a = Math.max(0, 1 - (state.animT - 200) / 700);
    ctx.save();
    ctx.translate(state.vX, state.vY);
    ctx.scale(state.scale, state.scale);
    ctx.globalAlpha = a * 0.7;
    ctx.fillStyle = '#e84848';
    ctx.beginPath();
    ctx.ellipse(10, -50, 6, 4.5, 0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  ctx.restore();

  if (state.animT < 9999 && state.animT < 700) {
    const p = state.animT / 700;
    let slipperX, slipperY, slipperAngle, slipperScale;
    const impactX = state.vX + 30 * state.scale;
    const impactY = state.vY - 50 * state.scale;
    const startX = W + 120;
    const startY = H * 0.45;

    if (p < 0.35) {
      const t = p / 0.35;
      const e = 1 - Math.pow(1 - t, 3);
      slipperX = startX + (impactX - startX) * e;
      slipperY = startY + (impactY - startY) * e;
      slipperAngle = 0.5 - e * 0.5;
      slipperScale = state.scale * 0.85;
    } else if (p < 0.55) {
      const t = (p - 0.35) / 0.2;
      slipperX = impactX + t * 40;
      slipperY = impactY + t * 30;
      slipperAngle = 0.3;
      slipperScale = state.scale * 0.85;
    } else {
      const t = (p - 0.55) / 0.45;
      slipperX = impactX + 40 + (W + 150 - impactX - 40) * t;
      slipperY = impactY + 30 - 100 * t;
      slipperAngle = -0.3 - t * 0.8;
      slipperScale = state.scale * 0.85 * (1 - t * 0.3);
    }
    drawSlipper(slipperX, slipperY, slipperAngle, slipperScale);
  }

  for (const p of state.particles) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.textAlign = 'center';
  for (const f of state.floats) {
    ctx.globalAlpha = Math.max(0, f.life);
    ctx.font = `900 ${Math.floor(42 * state.scale * 0.5)}px Archivo Black, sans-serif`;
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#d02020';
    ctx.lineWidth = 7;
    ctx.strokeText(f.text, f.x, f.y);
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;

  if (state.slaps === 0 && state.animT >= 9999) {
    ctx.font = `700 ${Math.floor(18 * state.scale * 0.5)}px Fredoka, sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.strokeStyle = 'rgba(180,20,20,0.9)';
    ctx.lineWidth = 4;
    ctx.strokeText('тапай по экрану 👋', W / 2, H - 40);
    ctx.fillText('тапай по экрану 👋', W / 2, H - 40);
  }
}

function slapAction() {
  if (mode !== 'slap') return;
  if (state.animT < 9999) return;
  state.animT = 0;
  state.slapDone = false;
}

function awardCoins(amount) {
  if (coinsAwarded || amount <= 0) return;
  coinsAwarded = true;
  playerData.coins += amount;
  savePlayerData();
  updateCoinsUI();
  sfxCoin();
}

let lastTime = 0;
function loop(t) {
  const dt = Math.min(50, t - lastTime);
  lastTime = t;
  skyTime += dt;
  updateClouds(dt);

  if (mode === 'tap') { updateTap(dt); renderTap(); }
  else if (mode === 'jump') { updateJump(dt); renderJump(); }
  else if (mode === 'slap') { updateSlap(dt); renderSlap(); }
  else {
    const pal = drawSky();
    drawStars(pal); drawSunMoon(pal); drawMovingClouds(pal, 0);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

cv.addEventListener('pointerdown', (e) => {
  if (mode === 'tap') tapAction();
  else if (mode === 'slap') slapAction();
  else if (mode === 'jump') state.touchX = e.clientX;
});
cv.addEventListener('pointermove', (e) => {
  if (mode === 'jump' && state.running) {
    if (e.buttons || e.pointerType === 'touch') state.touchX = e.clientX;
  }
});
cv.addEventListener('pointerup', () => { if (mode === 'jump') state.touchX = null; });
cv.addEventListener('pointercancel', () => { if (mode === 'jump') state.touchX = null; });

document.getElementById('mode1').onclick = startTap;
document.getElementById('mode2').onclick = startJump;
document.getElementById('mode3').onclick = startSlap;
document.getElementById('shopBtn').onclick = () => { sfxClick(); openShop(); };
document.getElementById('shopBack').onclick = () => { sfxClick(); closeShop(); };

backBtn.onclick = () => {

    }

    const name = document.createElement('div');
    name.className = 'shop-item-name';
    name.textContent = item.name;

    const desc = document.createElement('div');
    desc.className = 'shop-item-desc';
    desc.textContent = item.desc || '';

    const btn = document.createElement('button');
    btn.className = 'shop-item-btn';

    if (isEquipped) {
      btn.textContent = 'НАДЕТО'; btn.disabled = true;
    } else if (isOwned) {
      btn.textContent = 'НАДЕТЬ'; btn.classList.add('equip');
      btn.onclick = () => equipItem(item);
    } else {
      btn.textContent = 'КУПИТЬ ' + item.price; btn.classList.add('buy');
      btn.onclick = () => buyItem(item);
    }

    card.appendChild(preview);
    card.appendChild(name);
    if (item.desc) card.appendChild(desc);
    card.appendChild(btn);
    shopItems.appendChild(card);
  });
}

function buyItem(item) {
  if (playerData.coins < item.price) {
    showToast('НЕ ХВАТАЕТ МОНЕТ!');
    playTone(200, 0.2, 'sawtooth', 0.12);
    return;
  }
  playerData.coins -= item.price;
  playerData.owned.push(item.id);
  playerData.equipped[item.type] = item.id;
  savePlayerData();
  updateCoinsUI();
  renderShop();
  showToast('КУПЛЕНО!');
  sfxBuy();
}
function equipItem(item) {
  playerData.equipped[item.type] = item.id;
  savePlayerData();
  renderShop();
  sfxClick();
}

function showToast(msg) {
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = `
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    background: rgba(255,255,255,0.97); color:#b8424e; font-weight:700;
    padding: 14px 28px; border-radius: 20px; font-size: 18px;
    letter-spacing: 3px; text-transform: uppercase;
    box-shadow: 0 10px 30px rgba(200,60,120,0.5), 0 0 30px rgba(255,180,220,0.8), 0 0 0 3px #ffffff;
    z-index: 100; pointer-events: none;
    text-shadow: 0 0 10px rgba(255,180,220,0.8);
    animation: toastFade 1.4s ease-out forwards;
  `;
  if (!document.getElementById('toastStyle')) {
    const s = document.createElement('style');
    s.id = 'toastStyle';
    s.textContent = `@keyframes toastFade {
      0% { opacity:0; transform:translate(-50%,-30%); }
      15% { opacity:1; transform:translate(-50%,-50%); }
      75% { opacity:1; transform:translate(-50%,-50%); }
      100% { opacity:0; transform:translate(-50%,-70%); }
    }`;
    document.head.appendChild(s);
  }
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 1500);
}
</script>
